{
  id: 'habits', name: 'Habit Tracker', icon: '✅', cat: 'time',
  desc: 'Weekly habit grid with streaks — your data stays on your device.',
  kw: 'habit tracker streak routine daily check habits discipline goals',
  render(root) {
    let habits = NX.LS.get('habits') || [
      { id: NX.uid(), name: '💧 Drink 2L water', log: {} },
      { id: NX.uid(), name: '📚 Read 20 pages', log: {} },
      { id: NX.uid(), name: '🏃 Exercise', log: {} }
    ];
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const save = () => NX.LS.set('habits', habits);
    function monday(d) {
      const dt = new Date(d);
      const day = (dt.getDay() + 6) % 7;
      dt.setDate(dt.getDate() - day);
      return dt;
    }
    const key = (date) => date.toISOString().slice(0, 10);
    function streak(h) {
      let s = 0;
      const d = new Date();
      while (true) {
        if (h.log[key(d)]) s++;
        else if (s > 0 || key(d) !== key(new Date())) break;
        d.setDate(d.getDate() - 1);
        if (s > 999) break;
      }
      return s;
    }
    function draw() {
      const wk = [0, 1, 2, 3, 4, 5, 6].map(i => { const d = monday(new Date()); d.setDate(d.getDate() + i); return d; });
      root.innerHTML = `
        <div class="panel"><div class="row tight">
          <input class="input" id="hbNew" placeholder="New habit… e.g. 💪 workout, 🧘 meditate" style="flex:1">
          <button class="btn" id="hbAdd">➕ Add</button>
        </div></div>
        <div class="panel">
          <div class="habitgrid">
            <div class="hh"></div>${DAYS.map(d => `<div class="hh">${d}</div>`).join('')}
            ${habits.map((h, hi) => {
        const st = streak(h);
        return `<div class="row tight"><span style="font-size:13px;font-weight:600">${NX.esc(h.name)}</span>
              <button class="btn tiny ghost" data-del="${hi}" title="Delete">✕</button>
              ${st >= 2 ? `<span class="chip" style="font-size:10px;padding:1px 7px">🔥${st}</span>` : ''}</div>` +
          wk.map((d, di) => {
            const on = !!h.log[key(d)];
            return `<div class="habitcell ${on ? 'on' : ''}" data-h="${hi}" data-d="${di}" title="${d.toDateString()}">${on ? '✓' : ''}</div>`;
          }).join('');
      }).join('')}
          </div>
        </div>
        <p class="hint" style="text-align:center">Click any square to mark a day. 🔥 = current streak.</p>`;
      const G = (id) => NX.$(id, root);
      G('#hbAdd').onclick = () => {
        const v = G('#hbNew').value.trim();
        if (!v) return;
        habits.push({ id: NX.uid(), name: v, log: {} });
        save(); draw();
        G('#hbNew').focus();
      };
      G('#hbNew').onkeydown = (e) => { if (e.key === 'Enter') G('#hbAdd').click(); };
      root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        if (await NX.confirmBox('Delete habit?', '“' + habits[+b.dataset.del].name + '” and its history will be removed.')) {
          habits.splice(+b.dataset.del, 1); save(); draw();
        }
      });
      root.querySelectorAll('.habitcell').forEach(c => c.onclick = () => {
        const h = habits[+c.dataset.h];
        const wk = [0, 1, 2, 3, 4, 5, 6].map(i => { const d = monday(new Date()); d.setDate(d.getDate() + i); return d; });
        const d = wk[+c.dataset.d];
        const k = key(d);
        if (h.log[k]) delete h.log[k]; else h.log[k] = 1;
        save(); draw();
      });
    }
    draw();
  }
}
);
</script>

        function redraw() {
          cx.fillStyle = '#ffffff';
          cx.fillRect(0, 0, W, H);
          cx.lineCap = 'round';
          cx.lineJoin = 'round';
          for (const s of state.strokes) {
            if (!s.points || s.points.length < 2) continue;
            cx.strokeStyle = s.color;
            cx.lineWidth = s.size;
            cx.beginPath();
            cx.moveTo(s.points[0][0], s.points[0][1]);
            for (let i = 1; i < s.points.length; i++) cx.lineTo(s.points[i][0], s.points[i][1]);
            cx.stroke();
          }
        }
        redraw();
        wrap.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
          color = b.dataset.c; size = b.dataset.c === '#ffffff' ? Math.max(size, 14) : size;
          wrap.querySelectorAll('[data-c]').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');

          const mine = state.strokes.filter(s => s.by === (NX.Sync.clientId));
          const last = mine[mine.length - 1] || state.strokes[state.strokes.length - 1];
          if (last) ctx.send({ type: 'undo', strokeId: last.id });

          if (await NX.confirmBox('Clear whiteboard?', 'Everyone sees an empty board.')) ctx.send({ type: 'clear' });

        // drawing
        let drawing = false, points = [];
        const pos = (e) => {
          const r = cv.getBoundingClientRect();
          return [Math.round((e.clientX - r.left) / r.width * W), Math.round((e.clientY - r.top) / r.height * H)];
        };

          drawing = true;
          points = [pos(e)];
          cv.setPointerCapture(e.pointerId);

          if (!drawing) return;
          points.push(pos(e));
          // live preview segment
          cx.strokeStyle = color; cx.lineWidth = size;

          const n = points.length;

          cx.stroke();

          if (!drawing) return;
          drawing = false;

          points = [];

/* ---------------- RANDOM PICKER / WHEEL ---------------- */
{
  id: 'random', name: 'Wheel & Team Picker', icon: '🎡', cat: 'group',
  desc: 'Spin a wheel of names, draw winners, shuffle & split into teams.',
  kw: 'random picker wheel spin names raffle winner draw shuffle teams groups',
  render(root) {
    let names = NX.LS.get('wheel.names') || ['Amina', 'Brian', 'Chloe', 'David', 'Esther', 'Frank'];
    let spinning = false, angle = 0;
    root.innerHTML = `
      <div class="grid2">
        <div class="panel"><h3>👥 Participants <span class="hint" id="rdCount"></span></h3>
          <textarea class="textarea" id="rdIn" style="min-height:220px;font-family:var(--sans)" placeholder="One name per line…"></textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn small" id="rdPick1">🎲 Pick one winner</button>
            <button class="btn small ghost" id="rdPickN">🏆 Draw N winners</button>
            <button class="btn small ghost" id="rdTeams">👕 Split into teams</button>
            <button class="btn small ghost" id="rdShuffle">🔀 Shuffle order</button>
          </div>
        </div>
        <div class="panel"><div class="wheelbox">
          <div class="wheel-pointer"></div>
          <canvas id="rdWheel" width="380" height="380"></canvas>
          <button class="btn" id="rdSpin" style="border-radius:30px">🎡 SPIN</button>
        </div></div>
      </div>`;
    const G = (id) => NX.$(id, root);
    const cv = G('#rdWheel');
    const cx = cv.getContext('2d');
    const COLORS = ['#6d7dff', '#26d5c8', '#a78bfa', '#fbbf24', '#f87171', '#34d399', '#60a5fa', '#f472b6'];
    function list() { return G('#rdIn').value.split('\n').map(s => s.trim()).filter(Boolean); }
    function save() { NX.LS.set('wheel.names', list()); }
    function draw() {
      const ns = list();
      G('#rdCount').textContent = ns.length + ' entries';
      cx.clearRect(0, 0, 380, 380);
      if (!ns.length) {
        cx.fillStyle = '#8fa1c0'; cx.font = '15px sans-serif'; cx.textAlign = 'center';
        cx.fillText('add names on the left →', 190, 190);
        return;
      }
      const r = 178, cxp = 190, cyp = 190;
      const arc = Math.PI * 2 / ns.length;
      ns.forEach((n, i) => {
        const a0 = angle + i * arc;
        cx.beginPath();
        cx.moveTo(cxp, cyp);
        cx.arc(cxp, cyp, r, a0, a0 + arc);
        cx.fillStyle = COLORS[i % COLORS.length];
        cx.fill();
        cx.strokeStyle = 'rgba(255,255,255,.85)';
        cx.lineWidth = 1.5;
        cx.stroke();
        cx.save();
        cx.translate(cxp, cyp);
        cx.rotate(a0 + arc / 2);
        cx.textAlign = 'right';
        cx.fillStyle = '#fff';
        cx.font = 'bold 13px sans-serif';
        cx.fillText(n.slice(0, 16), r - 12, 4);
        cx.restore();
      });
    }
    function spin() {
      if (spinning) return;
      const ns = list();
      if (ns.length < 2) return NX.toast('Add at least 2 names', 'warn');
      save();
      spinning = true;
      G('#rdSpin').disabled = true;
      const winner = Math.floor(Math.random() * ns.length);
      const arc = Math.PI * 2 / ns.length;
      // land winner at top (pointer at -90deg)
      const targetPer = -Math.PI / 2 - winner * arc - arc / 2;
      const turns = 5 + Math.random() * 2;
      let delta = (targetPer - angle) % (Math.PI * 2);
      if (delta < 0) delta += Math.PI * 2;
      const total = turns * Math.PI * 2 + delta;
      const t0 = performance.now(), dur = 4200, startAngle = angle;
      (function anim(t) {
        const p = Math.min(1, (t - t0) / dur);
        const ease = 1 - Math.pow(1 - p, 4);
        angle = startAngle + total * ease;
        draw();
        if (p < 1) requestAnimationFrame(anim);
        else {
          spinning = false;
          G('#rdSpin').disabled = false;
          NX.beep(2);
          NX.modal({ title: '🏆 We have a winner!', body: `<div style="text-align:center;font-size:42px">🎉</div><h2 style="text-align:center">${NX.esc(ns[winner])}</h2>`, okText: 'Awesome' });
        }
      })(t0);
    }
    G('#rdSpin').onclick = spin;
    G('#rdIn').oninput = draw;
    G('#rdPick1').onclick = () => {
      const ns = list();
      if (!ns.length) return NX.toast('Add some names first', 'warn');
      NX.modal({ title: '🎲 Winner', body: `<h2 style="text-align:center">${NX.esc(ns[Math.floor(Math.random() * ns.length)])}</h2>`, okText: 'Nice' });
    };
    G('#rdPickN').onclick = async () => {
      const ns = [...new Set(list())];
      if (!ns.length) return NX.toast('Add some names first', 'warn');
      const n = await promptModal('Draw winners', 'How many winners?', '3');
      if (!n) return;
      const shuffled = ns.sort(() => Math.random() - 0.5).slice(0, Math.min(parseInt(n) || 1, ns.length));
      NX.modal({ title: '🏆 Winners', body: `<ol style="padding-left:22px;font-size:15px;line-height:2">${shuffled.map(w => `<li><b>${NX.esc(w)}</b></li>`).join('')}</ol>`, okText: 'Done' });
    };
    G('#rdTeams').onclick = async () => {
      const ns = list();
      if (ns.length < 2) return NX.toast('Add at least 2 names', 'warn');
      const n = await promptModal('Split into teams', 'How many teams?', '2');
      if (!n) return;
      const k = NX.clamp(parseInt(n) || 2, 2, 12);
      const shuffled = [...ns].sort(() => Math.random() - 0.5);
      const teams = Array.from({ length: k }, () => []);
      shuffled.forEach((name, i) => teams[i % k].push(name));
      NX.modal({
        title: '👕 Teams', wide: true,
        body: `<div class="grid2">${teams.map((t, i) => `<div class="panel" style="margin:0"><h3>Team ${i + 1} <span class="hint">(${t.length})</span></h3>${t.map(m => `<div>• ${NX.esc(m)}</div>`).join('') || '<span class="hint">—</span>'}</div>`).join('')}</div>`,
        okText: 'Done'
      });
    };
    G('#rdShuffle').onclick = () => {
      const ns = list();
      if (!ns.length) return;
      G('#rdIn').value = ns.sort(() => Math.random() - 0.5).join('\n');
      draw(); NX.toast('Shuffled ✓', 'ok');
    };
    G('#rdIn').value = names.join('\n');
    draw();
  }
}
);

/* prompt modal helper used by group tools */
function promptModal(title, label, value) {
  return new Promise(resolve => {
    const body = document.createElement('div');
    body.innerHTML = `<label class="f">${NX.esc(label)}</label><input class="input" value="${NX.esc(value || '')}">`;
    let result = null;
    NX.modal({
      title, body, okText: 'Save', cancelText: 'Cancel',
      onOk: (db) => { result = NX.$('input', db).value.trim(); }
    }).then(v => { resolve(result); });
    const inp = body.querySelector('input');
    inp.onkeydown = (e) => { if (e.key === 'Enter') { result = inp.value.trim(); body.closest('.overlay').remove(); resolve(result); } };
  });
}

      const guesses = Math.pow(2, bits) / 2;
      const perSec = 1e11; // modern offline attack, optimistic for attacker
      const s = guesses / perSec;
      if (s < 1) return 'instantly 😬';
      const u = [[60, 'seconds'], [60, 'minutes'], [24, 'hours'], [365, 'days'], [100, 'years'], [1e6, 'millennia']];
      let v = s, name = 'seconds';
      for (let i = 0; i < u.length; i++) { if (v < u[i][0]) { name = u[i][1]; break; } v /= u[i][0]; name = u[i][1]; }
      return v < 1 ? 'a few ' + name : Math.round(v).toLocaleString() + ' ' + name;
    }
    function gen() {
      let sets = '';
      if (G('#pwUp').checked) sets += 'ABCDEFGHJKLMNPQRSTUVWXYZ' + (G('#pwAm').checked ? '' : 'IO');
      if (G('#pwLo').checked) sets += 'abcdefghijkmnpqrstuvwxyz' + (G('#pwAm').checked ? '' : 'lo');
      if (G('#pwDi').checked) sets += '23456789' + (G('#pwAm').checked ? '' : '01');
      if (G('#pwSy').checked) sets += '!@#$%^&*()-_=+[]{};:,.<>?';
      if (!sets) { G('#pwOut').value = ''; return NX.toast('Pick at least one character set', 'warn'); }
      const len = parseInt(G('#pwLen').value);
      const bytes = crypto.getRandomValues(new Uint32Array(len));
      const pw = Array.from(bytes, b => sets[b % sets.length]).join('');
      G('#pwOut').value = pw;
      const bits = Math.log2(sets.length) * len;
      G('#pwBar').style.width = Math.min(100, bits / 128 * 100) + '%';
      G('#pwInfo').innerHTML = `<b>${Math.round(bits)} bits</b> of entropy · offline brute-force at 100 billion guesses/sec ≈ <b>${crackTime(bits)}</b>`;
    }
    function batch() {
      let sets = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const len = parseInt(G('#pwLen').value);
      const out = Array.from({ length: 10 }, () => {
        const b = crypto.getRandomValues(new Uint32Array(len));
        return Array.from(b, x => sets[x % sets.length]).join('');
      });
      G('#pwBatchOut').style.display = '';
      G('#pwBatchOut').textContent = out.join('\n');
    }
    G('#pwGo').onclick = gen;
    G('#pwCopy').onclick = async () => { await NX.copyText(G('#pwOut').value, true); NX.toast('Password copied ✓ — clipboard clears on reboot', 'ok'); };
    G('#pwBatch').onclick = batch;
    G('#pwPhrase').onclick = () => {
      const WORDS = 'anchor basket canyon dawn ember flock glacier harbor ivory jungle kernel lantern meadow nomad orbit pebble quiver ribbon summit tundra umbrella velvet walnut yield zephyr amber bramble cinder drift fern grove hollow inlet juniper kindle lumen moss norrow opal pine quill ridge stone thistle umber vine willow yarrow zinnia'.split(' ');
      const b = crypto.getRandomValues(new Uint32Array(4));
      const phrase = Array.from(b, x => WORDS[x % WORDS.length]).join('-');
      const n = Math.ceil(Math.random() * 90 + 10);
      G('#pwOut').value = phrase + '-' + n;
      const bits = Math.log2(WORDS.length) * 4 + Math.log2(90);
      G('#pwBar').style.width = Math.min(100, bits / 128 * 100) + '%';
      G('#pwInfo').innerHTML = `<b>${Math.round(bits)} bits</b> of entropy (memorable passphrase) · ≈ <b>${crackTime(bits)}</b> to brute-force`;
    };
    ['pwUp', 'pwLo', 'pwDi', 'pwSy', 'pwAm'].forEach(id => G('#' + id).onchange = gen);
    gen();
  }
},

{
  id: 'passcheck', name: 'Password Strength', icon: '💪', cat: 'sec',
  desc: "Test a password's safety — entropy, patterns & practical tips.",
  kw: 'password strength check test safe secure weak entropy audit',
  render(root) {
    const COMMON = ['password', '123456', '12345678', 'qwerty', 'abc123', 'monkey', 'letmein', 'dragon', '111111', 'baseball', 'iloveyou', 'trustno1', 'sunshine', 'master', 'welcome', 'shadow', 'ashley', 'football', 'jesus', 'michael', 'ninja', 'mustang', 'password1', 'admin', 'login', 'passw0rd', 'p@ssword', 'qwerty123', 'zaq12wsx', 'starwars', 'hello', 'freedom', 'whatever', 'qazwsx', 'password123', '1234567890', 'admin123', 'root', 'toor', 'pass', 'test', 'guest', 'info', 'oracle', 'changeme'];
    root.innerHTML = `
      <div class="panel"><input class="input mono" id="pcIn" type="text" placeholder="Type or paste a password to test…" style="font-size:16px">
        <p class="hint" style="margin-top:8px">⚠️ Nothing is sent anywhere — checking runs 100% in this tab. Still, prefer test passwords here.</p>
      </div>
      <div class="kpis" id="pcKpis"></div>
      <div class="panel" id="pcTips"><h3>🧠 Analysis</h3><span class="hint">Results appear as you type…</span></div>`;
    const G = (id) => NX.$(id, root);
    function analyze(pw) {
      const issues = [];
      let bits = 0;
      if (!pw) return { bits: 0, issues };
      let pool = 0;
      if (/[a-z]/.test(pw)) pool += 26;
      if (/[A-Z]/.test(pw)) pool += 26;
      if (/[0-9]/.test(pw)) pool += 10;
      if (/[^a-zA-Z0-9]/.test(pw)) pool += 33;
      bits = pw.length * Math.log2(pool || 1);
      const low = pw.toLowerCase();
      if (COMMON.includes(low)) { bits = Math.min(bits, 8); issues.push(['bad', 'This is one of the world\u2019s most common passwords — cracked instantly.']); }
      if (COMMON.some(c => c.length > 5 && low.includes(c))) issues.push(['warn', 'Contains a very common word — dictionary attacks try these first.']);
      if (/^[0-9]+$/.test(pw)) issues.push(['warn', 'Digits only — tiny search space.']);
      if (/^(.)\1+$/.test(pw)) { bits = Math.min(bits, 6); issues.push(['bad', 'All identical characters.']); }
      const seq = 'abcdefghijklmnopqrstuvwxyz0123456789qwertyuiopasdfghjklzxcvbnm';
      for (let i = 0; i < pw.length - 2; i++) {
        const s = low.slice(i, i + 3);
        if (seq.includes(s) || seq.includes([...s].reverse().join(''))) { issues.push(['warn', 'Contains a keyboard or alphabet sequence (like “abc” or “123”).']); break; }
      }
      if (pw.length < 8) issues.push(['bad', 'Shorter than 8 characters — too short for any modern use.']);
      else if (pw.length < 12) issues.push(['warn', 'Under 12 characters — fine-ish today, weak tomorrow. Aim for 16+.']);
      if (!/[^a-zA-Z0-9]/.test(pw) && pw.length > 0) issues.push(['hint', 'No symbols — adding them multiplies the search space.']);
      if (/^[A-Z][a-z]+\d*[!.?]$/.test(pw)) issues.push(['warn', 'Classic “Capital + word + digits + !” pattern — very predictable.']);
      if (/(19|20)\d{2}/.test(pw)) issues.push(['hint', 'Contains a year — attackers guess years heavily.']);
      if (pw.length >= 16 && bits >= 80) issues.push(['good', 'Length + variety — excellent. Consider a password manager to keep this up.']);
      return { bits, issues };
    }
    let t;
    G('#pcIn').oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const pw = G('#pcIn').value;
        const { bits, issues } = analyze(pw);
        const score = !pw ? 0 : bits < 28 ? 1 : bits < 40 ? 2 : bits < 60 ? 3 : bits < 80 ? 4 : 5;
        const labels = ['', 'Very weak', 'Weak', 'Okay', 'Strong', 'Fort Knox 🏰'];
        const colors = ['', 'var(--bad)', 'var(--bad)', 'var(--warn)', 'var(--good)', 'var(--good)'];
        G('#pcKpis').innerHTML = `
          <div class="kpi"><div class="kv" style="color:${colors[score]}">${labels[score] || '—'}</div><div class="kl">Verdict</div></div>
          <div class="kpi"><div class="kv">${pw ? Math.round(bits) : '—'}</div><div class="kl">Entropy bits</div></div>
          <div class="kpi"><div class="kv">${pw ? pw.length : '—'}</div><div class="kl">Characters</div></div>
          <div class="kpi"><div class="kv" style="font-size:13px;line-height:1.5">${pw ? (bits < 40 ? 'seconds' : bits < 60 ? 'days' : bits < 80 ? 'centuries' : 'beyond forever') : '—'}</div><div class="kl">Offline crack time</div></div>`;
        const tips = G('#pcTips');
        if (!pw) { tips.innerHTML = '<h3>🧠 Analysis</h3><span class="hint">Results appear as you type…</span>'; return; }
        tips.innerHTML = '<h3>🧠 Analysis</h3>' + (issues.length
          ? issues.map(([lvl, msg]) => `<p style="margin:5px 0;font-size:13px;color:${lvl === 'bad' ? 'var(--bad)' : lvl === 'warn' ? 'var(--warn)' : lvl === 'good' ? 'var(--good)' : 'var(--muted)'}">${lvl === 'bad' ? '⛔' : lvl === 'warn' ? '⚠️' : lvl === 'good' ? '✅' : '💡'} ${NX.esc(msg)}</p>`).join('')
          : '<p style="color:var(--good)">✅ No common weaknesses detected — solid password.</p>');
      }, 200);
    };
  }
},

        const label = decodeURIComponent(u.pathname.replace(/^\//, ''));
        const [issuer, name] = label.includes(':') ? label.split(':', 2) : ['', label];
        const p = u.searchParams;
        return {

          name: name || label || 'Account',
          secret: (p.get('secret') || '').replace(/\s/g, ''),
          period: parseInt(p.get('period')) || 30,
          digits: parseInt(p.get('digits')) || 6

    }

      const body = document.createElement('div');
      body.innerHTML = `

          save(); draw();
        }
      });

    G('#tfAdd').onclick = () => addDialog();

          accounts.push({ id: NX.uid(), ...acc }); save(); draw();
        }
      });

    G('#tfExport').onclick = () => {
      if (!accounts.length) return NX.toast('No accounts to back up');
      NX.download(new Blob([JSON.stringify({ nx2fa: accounts }, null, 2)], { type: 'application/json' }), 'nexus-2fa-backup.json');
    };
    G('#tfImport').onclick = () => NX.pickFiles('.json', false, (fs) => {
      fs[0].text().then(t => {
        try {
          const j = JSON.parse(t);
          const list = j.nx2fa || (Array.isArray(j) ? j : null);
          if (!Array.isArray(list)) throw 0;
          let added = 0;
          list.forEach(a => { if (a.secret && /^[A-Z2-7]+/i.test(a.secret)) { accounts.push({ id: NX.uid(), issuer: a.issuer || 'Account', name: a.name || '', secret: a.secret.toUpperCase().replace(/\s/g, ''), period: a.period || 30, digits: a.digits || 6 }); added++; } });
          save(); draw();
          NX.toast('Restored ' + added + ' accounts ✓', 'ok');
        } catch { NX.toast('Not a valid backup file', 'err'); }
      });
    });
    async function draw() {
      const list = G('#tfList');
      if (!accounts.length) {
        list.innerHTML = '<div class="empty"><span class="big">🛡️</span>No 2FA accounts yet.<br>When a website offers two-factor authentication and shows a <b>setup key</b>, add it here — this generates the same 6-digit codes as your phone authenticator.</div>';
        return;
      }
      list.innerHTML = '';
      const now = Date.now();
      for (const a of accounts) {
        const period = a.period || 30;
        const left = period - Math.floor(now / 1000) % period;
        let code = '••••••';
        try { code = await NXTOTP.totp(a.secret, period, a.digits || 6); } catch { code = 'ERROR'; }
        const card = document.createElement('div');
        card.className = 'totpcard';
        card.innerHTML = `

        card.querySelector('[data-del]').onclick = async () => {
          if (await NX.confirmBox('Remove account?', 'You will lose 2FA codes for ' + a.issuer + ' unless you have the secret backed up.')) {
            accounts = accounts.filter(x => x.id !== a.id); save(); draw();
          }
        };
        list.appendChild(card);
      }
    }
    draw();
    iv = setInterval(() => { if (root.isConnected) draw(); }, 1000);
  }
}

    { id: 'media', name: 'Media & Design', icon: '🖼️' },
    { id: 'text', name: 'Text & Writing', icon: '✍️' },
    { id: 'dev', name: 'Developer', icon: '💻' },
    { id: 'calc', name: 'Calculators', icon: '🧮' },
    { id: 'time', name: 'Time & Focus', icon: '⏱️' },
    { id: 'group', name: 'Group & Teams', icon: '👥' },
    { id: 'sec', name: 'Security & Privacy', icon: '🔐' }
  ];
  let activeCat = 'all', query = '';

  function toolById(id) { return NX_TOOLS.find(t => t.id === id); }

  function drawSidebar() {
    const cats = NX.$('#cats');
    cats.innerHTML = '';
    CATS.forEach(c => {
      const n = c.id === 'all' ? NX_TOOLS.length : NX_TOOLS.filter(t => t.cat === c.id).length;
      const b = document.createElement('button');
      b.className = 'catbtn' + (activeCat === c.id ? ' active' : '');
      b.innerHTML = `<span class="ci">${c.icon}</span>${c.name}<span class="cc">${n}</span>`;
      b.onclick = () => {
        activeCat = c.id;
        location.hash = '#/';
        drawSidebar(); drawHome();
        NX.$('#sidebar').classList.remove('open');
      };
      cats.appendChild(b);
    });
  }

  function drawHome() {
    const content = NX.$('#content');
    NX.$('#topbar').innerHTML = `<h1>${CATS.find(c => c.id === activeCat).icon} ${CATS.find(c => c.id === activeCat).name}</h1>`;
    const q = query.toLowerCase();
    const tools = NX_TOOLS.filter(t =>
      (activeCat === 'all' || t.cat === activeCat) &&
      (!q || (t.name + ' ' + t.desc + ' ' + (t.kw || '')).toLowerCase().includes(q)));
    let html = '';
    if (activeCat === 'all' && !q) {
      html += `<div class="hero">
        <h2>48 professional tools. One file. Zero cost.</h2>
        <p>PDF editing, invoices, Excel exports, image tools, live team boards, 2FA codes and much more — all running <b>privately inside your browser</b>. No accounts, no uploads, no subscriptions.</p>
        <div class="tags"><span class="tag">🔓 All free</span><span class="tag">📴 Works offline</span><span class="tag">🔒 Nothing uploaded</span><span class="tag">👥 Optional live team sync</span></div>
      </div>`;
    }
    if (!tools.length) {
      html += `<div class="empty" style="padding:80px 20px"><span class="big">🔍</span>No tools match “${NX.esc(query)}”.<br><span class="hint">Try “pdf”, “qr”, “password”, “kanban”…</span></div>`;
    } else {
      const byCat = {};
      tools.forEach(t => (byCat[t.cat] = byCat[t.cat] || []).push(t));
      const order = activeCat === 'all' ? CATS.filter(c => c.id !== 'all') : [{ id: activeCat, name: '', icon: '' }];
      for (const c of order) {
        const list = activeCat === 'all' ? byCat[c.id] : tools;
        if (!list || !list.length) continue;
        html += `<div class="sechead">${c.icon} ${c.name}</div><div class="toolgrid">`;
        for (const t of list) {
          html += `<div class="toolcard" data-tool="${t.id}">
            ${t.pro ? '<span class="badge-pro">PRO-STYLE</span>' : ''}
            <div class="ti">${t.icon}</div><div class="tn">${NX.esc(t.name)}</div>
            <div class="td">${NX.esc(t.desc)}</div>
            <div class="tf">open →</div></div>`;
        }
        html += '</div>';
      }
    }
    content.innerHTML = html;
    content.scrollTop = 0;
    content.querySelectorAll('[data-tool]').forEach(card => card.onclick = () => { location.hash = '#/t/' + card.dataset.tool; });
  }

  function drawTool(id, room) {
    const t = toolById(id);
    const content = NX.$('#content');
    if (!t) { location.hash = '#/'; return; }
    NX.$('#topbar').innerHTML = `
      <button class="backbtn" onclick="location.hash='#/'">← All tools</button>
      <h1>${t.icon} ${NX.esc(t.name)}</h1>
      <span class="sub">${NX.esc(t.desc)}</span>`;
    content.innerHTML = '';
    content.scrollTop = 0;
    try {
      t.render(content);
    } catch (e) {
      content.innerHTML = `<div class="empty"><span class="big">⚠️</span>This tool failed to load: <span class="mono">${NX.esc(e.message)}</span></div>`;
      console.error(e);
    }
  }

  function route() {
    const h = location.hash || '#/';
    NX.$('#burger').style.display = window.innerWidth <= 860 ? 'block' : 'none';
    if (h.startsWith('#/t/')) {
      const m = h.match(/^#\/t\/([a-z0-9]+)(?:\/room\/([A-Za-z0-9]+))?/);
      if (m) {
        const tool = toolById(m[1]);
        if (tool && NX.GROUP_TOOLS.includes(tool.id) && m[2]) {
          // ensure group tool renders then connects (groupShell reads hash itself)
          drawTool(m[1], m[2]);
          return;
        }
        drawTool(m[1]);
        return;
      }
    }
    drawHome();
  }

  /* theme */
  function setTheme(th) {
    document.documentElement.dataset.theme = th;
    NX.LS.set('theme', th);
    NX.$('#themeBtn').textContent = th === 'dark' ? '🌙' : '☀️';
  }
  NX.$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  setTheme(NX.LS.get('theme') || 'dark');

  /* search */
  NX.$('#searchInput').oninput = (e) => {
    query = e.target.value.trim();
    activeCat = 'all';
    drawSidebar();
    if (!location.hash || location.hash === '#/' || location.hash.startsWith('#/t/')) location.hash = '#/';
    drawHome();
  };

  /* burger */
  NX.$('#burger').onclick = () => NX.$('#sidebar').classList.toggle('open');
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => { NX.$('#burger').style.display = window.innerWidth <= 860 ? 'block' : 'none'; });

  drawSidebar();
  route();

  /* server hint when serving live */
  NX.Sync.detectServer().then(base => {
    if (base) console.log('%c⚡ NexusTools live sync available — group tools can Go Live!', 'color:#26d5c8;font-weight:bold');
  });
  } catch (e) {
    // last-resort visible fallback so the app never appears blank
    try {
      const c = NX.$('#content');
      if (c) c.innerHTML = '<div class="panel"><h3>⚠️ Startup hiccup</h3><p class="hint">' + NX.esc(e.message) + '</p>'
        + '<p class="hint">The tools suite still works — open this file directly in Chrome/Edge/Firefox, or run <code class="inline">node server.js</code> and load it from the server.</p></div>';
    } catch (e2) { }
    console.error(e);
  }
})();
</script>

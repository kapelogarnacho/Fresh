<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00FFFF">
    <title>NEON NEXUS // CHAT HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;500;600&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ── RESET & ROOT ── */
        :root {
            --n1: #00f3ff;
            --n2: #ff00ff;
            --n3: #00ff88;
            --n4: #ffee00;
            --n5: #ff6b6b;
            --bg: #07070a;
            --surface: #0f0f15;
            --surface2: #181825;
            --card: #1a1a2e;
            --text: #f0f0f8;
            --text-dim: #8a8a9a;
            --text-muted: #5a5a6a;
            --border: #2a2a3e;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --font-body: 'Inter', sans-serif;
            --font-header: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow: hidden;
            height: 100vh;
            transition: background var(--transition), color var(--transition);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--n1);
            border-radius: 10px;
        }

        /* ── THEMES ── */
        body.theme-dark {
            --bg: #07070a;
            --surface: #0f0f15;
            --surface2: #181825;
            --card: #1a1a2e;
            --text: #f0f0f8;
            --text-dim: #8a8a9a;
            --text-muted: #5a5a6a;
            --border: #2a2a3e;
        }
        body.theme-light {
            --bg: #eef0f5;
            --surface: #ffffff;
            --surface2: #f5f7fc;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-dim: #6a6a7a;
            --text-muted: #9a9aaa;
            --border: #d0d5e0;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }
        body.theme-neon {
            --bg: #0a001a;
            --surface: #12002a;
            --surface2: #1a003a;
            --card: #22004a;
            --text: #d0c0ff;
            --text-dim: #8866cc;
            --text-muted: #553388;
            --border: #442288;
            --shadow: 0 8px 40px rgba(100, 0, 255, 0.15);
        }
        body.theme-amber {
            --bg: #1a0e00;
            --surface: #2a1800;
            --surface2: #3a2200;
            --card: #4a2e00;
            --text: #ffdd99;
            --text-dim: #bb8833;
            --text-muted: #775522;
            --border: #664400;
            --shadow: 0 8px 40px rgba(255, 150, 0, 0.1);
        }

        /* ── FONTS ── */
        body.font-inter {
            --font-body: 'Inter', sans-serif;
            --font-header: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }
        body.font-space {
            --font-body: 'Space Grotesk', sans-serif;
            --font-header: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }
        body.font-exo {
            --font-body: 'Exo 2', sans-serif;
            --font-header: 'Exo 2', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }
        body.font-mono {
            --font-body: 'Share Tech Mono', monospace;
            --font-header: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        /* ── LAYOUT ── */
        .app-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ── LEFT SIDEBAR: CHANNELS ── */
        .sidebar-channels {
            width: 280px;
            min-width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), background var(--transition);
            z-index: 100;
            flex-shrink: 0;
        }
        .sidebar-channels .brand {
            padding: 20px 24px 16px;
            font-family: var(--font-header);
            font-size: 1.15rem;
            letter-spacing: 5px;
            background: linear-gradient(90deg, var(--n1), var(--n2));
            -webkit-background-clip: text;
            color: transparent;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-channels .brand .toggle-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
        }
        .sidebar-channels .brand .toggle-btn:hover {
            color: var(--text);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            position: relative;
        }
        .channel-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border);
        }
        .channel-item.active {
            background: rgba(0, 243, 255, 0.08);
            border-color: var(--n1);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.02);
        }
        .channel-item .icon {
            font-size: 1.2rem;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        .channel-item .info {
            flex: 1;
            min-width: 0;
        }
        .channel-item .info .name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item .info .preview {
            font-size: 0.7rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item .badge {
            background: var(--n2);
            color: #fff;
            border-radius: 30px;
            padding: 0 8px;
            font-size: 0.6rem;
            font-weight: 700;
            line-height: 1.6;
            flex-shrink: 0;
        }
        .channel-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .channel-item .dot.online {
            background: var(--n3);
        }
        .channel-item .dot.away {
            background: var(--n4);
        }
        .channel-item .dot.offline {
            background: var(--text-muted);
        }

        .sidebar-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-footer .actions {
            display: flex;
            gap: 6px;
        }
        .sidebar-footer .actions button {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .sidebar-footer .actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        /* ── MAIN CHAT AREA ── */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
            min-width: 0;
            position: relative;
        }

        /* Chat Header */
        .chat-header {
            padding: 16px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            transition: background var(--transition);
        }
        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header .left .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .chat-header .left .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }
        .chat-header .left .room-icon {
            font-size: 1.6rem;
        }
        .chat-header .left .room-title {
            font-family: var(--font-header);
            font-size: 1.05rem;
            letter-spacing: 2px;
        }
        .chat-header .left .room-sub {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-left: 8px;
        }
        .chat-header .right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .right button {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .chat-header .right button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }
        .chat-header .right button.party-btn {
            color: var(--n2);
            border: 1px solid var(--n2);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font-body);
        }
        .chat-header .right button.party-btn:hover {
            background: var(--n2);
            color: #000;
            box-shadow: 0 0 40px var(--n2);
        }
        .chat-header .right button.party-btn.active {
            background: var(--n2);
            color: #000;
        }

        /* Messages */
        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg);
            transition: background var(--transition);
        }
        .message-area .msg {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            max-width: 78%;
            word-break: break-word;
            line-height: 1.5;
            font-size: 0.85rem;
            animation: msgIn 0.25s ease;
            position: relative;
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message-area .msg.self {
            align-self: flex-end;
            background: var(--n1);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .message-area .msg.bot {
            align-self: flex-start;
            background: var(--surface2);
            border-left: 3px solid var(--n1);
            color: var(--text);
        }
        .message-area .msg.system {
            align-self: center;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.7rem;
            font-style: italic;
            max-width: 90%;
            text-align: center;
            padding: 4px 12px;
        }
        .message-area .msg.future {
            border-left: 3px solid var(--n2);
            background: rgba(255, 0, 255, 0.05);
            color: var(--text);
        }
        .message-area .msg .meta {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .message-area .msg .meta .time {
            font-family: var(--font-mono);
        }
        .message-area .msg .reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .message-area .msg .reactions span {
            font-size: 0.7rem;
            padding: 0 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .message-area .msg .reactions span:hover {
            border-color: var(--border);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Typing indicator */
        .typing-indicator {
            padding: 4px 16px;
            font-size: 0.7rem;
            color: var(--text-dim);
            display: none;
            align-self: flex-start;
            gap: 6px;
            align-items: center;
        }
        .typing-indicator .dots {
            display: inline-flex;
            gap: 3px;
        }
        .typing-indicator .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            animation: typingDot 1.2s infinite;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingDot {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* Input area */
        .input-area {
            padding: 12px 24px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
            transition: background var(--transition);
        }
        .input-area .input-wrap {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 4px 8px;
            transition: 0.2s;
        }
        .input-area .input-wrap:focus-within {
            border-color: var(--n1);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.03);
        }
        .input-area .input-wrap textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 8px 6px;
            outline: none;
            font-family: var(--font-body);
            font-size: 0.85rem;
            resize: none;
            min-height: 40px;
            max-height: 120px;
            line-height: 1.4;
            width: 100%;
        }
        .input-area .input-wrap textarea::placeholder {
            color: var(--text-muted);
        }
        .input-area .input-wrap .emoji-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .input-area .input-wrap .emoji-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .input-area .send-btn {
            background: var(--n1);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-family: var(--font-body);
            font-size: 0.85rem;
            transition: 0.2s;
            flex-shrink: 0;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-area .send-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
        }
        .input-area .attach-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .input-area .attach-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        /* ── RIGHT SIDEBAR: CONTACTS & INFO ── */
        .sidebar-right {
            width: 260px;
            min-width: 260px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), background var(--transition);
            flex-shrink: 0;
        }
        .sidebar-right .header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-header);
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-right .header button {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .sidebar-right .header button:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .sidebar-right .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .sidebar-right .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .sidebar-right .contact-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border);
        }
        .sidebar-right .contact-item .avatar {
            font-size: 1.4rem;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-right .contact-item .info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-right .contact-item .info .name {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .sidebar-right .contact-item .info .status {
            font-size: 0.65rem;
            color: var(--text-dim);
        }
        .sidebar-right .contact-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sidebar-right .contact-item .dot.online {
            background: var(--n3);
        }
        .sidebar-right .contact-item .dot.away {
            background: var(--n4);
        }
        .sidebar-right .contact-item .dot.offline {
            background: var(--text-muted);
        }
        .sidebar-right .footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .sidebar-right .footer button {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            transition: 0.2s;
            font-family: var(--font-body);
        }
        .sidebar-right .footer button:hover {
            border-color: var(--n1);
            color: var(--n1);
        }

        /* ── PARTY MODE ── */
        body.party-active .chat-header .room-title {
            animation: jitter 0.5s infinite;
        }
        body.party-active .message-area .msg {
            animation: msgIn 0.25s ease, partyGlow 2s infinite alternate;
        }
        body.party-active .input-area .send-btn {
            animation: pulseBtn 1.5s infinite alternate;
        }
        @keyframes jitter {
            0% {
                transform: translate(0);
                filter: hue-rotate(0deg);
            }
            50% {
                transform: translate(3px, -3px);
                filter: hue-rotate(180deg);
            }
            100% {
                transform: translate(-3px, 3px);
                filter: hue-rotate(360deg);
            }
        }
        @keyframes partyGlow {
            0% {
                box-shadow: 0 0 0px var(--n1);
            }
            100% {
                box-shadow: 0 0 20px var(--n2), 0 0 40px var(--n1);
            }
        }
        @keyframes pulseBtn {
            0% {
                box-shadow: 0 0 0px var(--n1);
            }
            100% {
                box-shadow: 0 0 30px var(--n2), 0 0 60px var(--n1);
            }
        }
        body.party-active .sidebar-channels .brand {
            animation: jitter 0.5s infinite;
        }
        body.party-active .sidebar-right .header {
            animation: jitter 0.5s infinite;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 30px;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal h2 {
            font-family: var(--font-header);
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-bottom: 16px;
            color: var(--n1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
        }
        .modal .close-btn:hover {
            color: var(--text);
        }
        .modal label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin: 12px 0 4px;
        }
        .modal input,
        .modal select,
        .modal textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.85rem;
            transition: 0.2s;
            outline: none;
        }
        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            border-color: var(--n1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.03);
        }
        .modal textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal .btn-primary {
            background: var(--n1);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-family: var(--font-body);
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .modal .btn-primary:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }
        .modal .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
            margin-left: 8px;
            font-size: 0.85rem;
        }
        .modal .btn-secondary:hover {
            border-color: var(--text);
        }
        .modal .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .modal .row>* {
            flex: 1;
            min-width: 120px;
        }
        .modal .item-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            background: var(--bg);
        }
        .modal .item-list .item {
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        .modal .item-list .item:last-child {
            border-bottom: none;
        }
        .modal .item-list .item .tag {
            font-size: 0.6rem;
            padding: 0 8px;
            border-radius: 20px;
            background: rgba(255, 0, 255, 0.08);
            color: var(--n2);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 24px;
            box-shadow: var(--shadow);
            z-index: 999;
            font-size: 0.85rem;
            animation: slideUp 0.4s ease;
            max-width: 380px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast .toast-icon {
            font-size: 1.4rem;
        }
        .toast .toast-body .toast-title {
            font-weight: 700;
            color: var(--n1);
        }
        .toast .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
            padding: 0 4px;
        }

        /* ── EMOJI PICKER (simple) ── */
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            box-shadow: var(--shadow);
            z-index: 50;
            max-width: 260px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .emoji-picker.open {
            display: flex;
        }
        .emoji-picker span {
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .emoji-picker span:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 1024px) {
            .sidebar-right {
                width: 220px;
                min-width: 220px;
            }
        }
        @media (max-width: 820px) {
            .sidebar-right {
                transform: translateX(260px);
                position: fixed;
                right: 0;
                top: 0;
                height: 100vh;
                box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
                z-index: 150;
            }
            .sidebar-right.open {
                transform: translateX(0);
            }
            .sidebar-channels {
                width: 240px;
                min-width: 240px;
            }
        }
        @media (max-width: 640px) {
            .sidebar-channels {
                position: fixed;
                transform: translateX(-280px);
                height: 100vh;
                box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
                z-index: 200;
            }
            .sidebar-channels.open {
                transform: translateX(0);
            }
            .chat-header .left .back-btn {
                display: block;
            }
            .chat-header .left .room-sub {
                display: none;
            }
            .chat-header {
                padding: 12px 16px;
            }
            .message-area {
                padding: 12px 14px;
            }
            .message-area .msg {
                max-width: 90%;
                font-size: 0.8rem;
            }
            .input-area {
                padding: 10px 14px 14px;
                gap: 6px;
            }
            .input-area .send-btn {
                padding: 8px 14px;
                font-size: 0.75rem;
                height: 40px;
            }
            .modal {
                padding: 20px;
                margin: 10px;
            }
            .toast {
                bottom: 16px;
                right: 16px;
                left: 16px;
                max-width: none;
            }
            .sidebar-right {
                width: 100%;
                transform: translateX(100%);
                border-left: none;
            }
            .sidebar-right.open {
                transform: translateX(0);
            }
        }

        /* ── UTILITY ── */
        .hidden {
            display: none !important;
        }
        .text-dim {
            color: var(--text-dim);
        }
        .text-muted {
            color: var(--text-muted);
        }
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .items-center {
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-4 {
            gap: 4px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .tag-sm {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- ─── LEFT SIDEBAR: CHANNELS ─── -->
        <aside class="sidebar-channels" id="sidebarChannels">
            <div class="brand">
                <span>⍟ NEXUS</span>
                <button class="toggle-btn" id="toggleChannels" aria-label="Toggle channels">☰</button>
            </div>
            <div class="channel-list" id="channelList">
                <!-- populated by JS -->
            </div>
            <div class="sidebar-footer">
                <span>v2.0 · 16 cores</span>
                <div class="actions">
                    <button onclick="openModal('dashboard')" title="Dashboard">📊</button>
                    <button onclick="openModal('settings')" title="Settings">🎛️</button>
                    <button onclick="openModal('contacts')" title="Contacts">👥</button>
                    <button onclick="openModal('groups')" title="Groups">📁</button>
                </div>
            </div>
        </aside>

        <!-- ─── MAIN CHAT ─── -->
        <main class="chat-main">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="left">
                    <button class="back-btn" id="backBtn" onclick="closeSidebar('sidebarChannels')">←</button>
                    <span class="room-icon" id="roomIcon">🏎️</span>
                    <span class="room-title" id="roomTitle">Neon Drift 2</span>
                    <span class="room-sub" id="roomSub">● 12 online</span>
                </div>
                <div class="right">
                    <button onclick="openModal('facetime')" title="FaceTime Swipe">📹</button>
                    <button onclick="openModal('forward')" title="Forward">📨</button>
                    <button onclick="cloneCurrentRoom()" title="Clone">🧬</button>
                    <button class="party-btn" id="partyBtn" onclick="toggleParty()">🎉 PARTY</button>
                </div>
            </header>

            <!-- Message Area -->
            <div class="message-area" id="messageArea">
                <!-- populated by JS -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span>Someone is typing</span>
                <span class="dots"><span></span><span></span><span></span></span>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <button class="attach-btn" onclick="openModal('forward')" title="Forward">📨</button>
                <div class="input-wrap" style="position:relative;">
                    <button class="emoji-btn" id="emojiBtn" onclick="toggleEmojiPicker()">😀</button>
                    <textarea id="messageInput" rows="1" placeholder="Type a message..." onkeydown="handleInputKey(event)"></textarea>
                    <div class="emoji-picker" id="emojiPicker">
                        <span onclick="insertEmoji('😀')">😀</span>
                        <span onclick="insertEmoji('😄')">😄</span>
                        <span onclick="insertEmoji('😂')">😂</span>
                        <span onclick="insertEmoji('🥰')">🥰</span>
                        <span onclick="insertEmoji('😎')">😎</span>
                        <span onclick="insertEmoji('🤖')">🤖</span>
                        <span onclick="insertEmoji('💜')">💜</span>
                        <span onclick="insertEmoji('🔥')">🔥</span>
                        <span onclick="insertEmoji('✨')">✨</span>
                        <span onclick="insertEmoji('🚀')">🚀</span>
                        <span onclick="insertEmoji('💎')">💎</span>
                        <span onclick="insertEmoji('🎉')">🎉</span>
                    </div>
                </div>
                <button class="send-btn" onclick="sendMessage()">➤ Send</button>
            </div>
        </main>

        <!-- ─── RIGHT SIDEBAR: CONTACTS ─── -->
        <aside class="sidebar-right" id="sidebarRight">
            <div class="header">
                <span>👥 CONTACTS</span>
                <button onclick="openModal('contacts')">+</button>
            </div>
            <div class="contact-list" id="contactList">
                <!-- populated by JS -->
            </div>
            <div class="footer">
                <button onclick="openModal('facetime')">📹 Swipe</button>
                <button onclick="openModal('groups')">📁 Groups</button>
                <button onclick="openModal('admin')">⚙️ Admin</button>
            </div>
        </aside>
    </div>

    <!-- ─── MODAL ─── -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- ─── TOAST ─── -->
    <div id="toastContainer"></div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const CATEGORIES = [
            { name: "Neon Drift 2", icon: "🏎️", color: "#00f3ff" },
            { name: "Gravity Flip", icon: "🪐", color: "#ff00ff" },
            { name: "Cyber Breaker", icon: "🧱", color: "#00ff88" },
            { name: "Matrix Defense", icon: "🛡️", color: "#ffee00" },
            { name: "Serpent 2077", icon: "🐍", color: "#ff6b6b" },
            { name: "Pulse Rhythm", icon: "🎵", color: "#33ffaa" },
            { name: "Laser Grid", icon: "⚡", color: "#ff0055" },
            { name: "Orbital Assault", icon: "🚀", color: "#5500ff" },
            { name: "Neon Memory", icon: "🧠", color: "#00ccff" },
            { name: "Hyper Clicker", icon: "🎯", color: "#ccff00" },
            { name: "Void Runner", icon: "🏃", color: "#ff8800" },
            { name: "Data Siphon", icon: "💾", color: "#00ffcc" },
            { name: "Hack Command", icon: "⌨️", color: "#ff00aa" },
            { name: "Neural Link", icon: "🔗", color: "#aaff00" },
            { name: "Glitch Hunter", icon: "👾", color: "#ff0000" },
            { name: "System Core", icon: "💎", color: "#ffffff" }
        ];

        const DEFAULT_STATE = {
            contacts: [
                { id: 'c1', name: 'Zara', status: 'online', avatar: '🧑‍💻' },
                { id: 'c2', name: 'Kai', status: 'away', avatar: '👾' },
                { id: 'c3', name: 'Luna', status: 'offline', avatar: '🌙' },
                { id: 'c4', name: 'Rex', status: 'online', avatar: '🦊' },
                { id: 'c5', name: 'Nova', status: 'online', avatar: '⭐' },
            ],
            groups: [
                { id: 'g1', name: 'Neon Riders', members: ['c1', 'c2'], roomIds: [0, 2] },
                { id: 'g2', name: 'Void Crew', members: ['c3', 'c4'], roomIds: [1, 7] },
            ],
            adminRequests: [
                { id: 'ar1', userId: 'c2', userName: 'Kai', reason: 'Want to moderate', status: 'pending' },
            ],
            messages: {}, // roomIndex -> [{text, from, time, type, reactions}]
            futureMessages: [], // [{id, text, roomIdx, deliverAt, from, delivered}]
            theme: 'dark',
            font: 'inter',
            party: false,
            activeRoom: 0,
            roomClones: {}, // roomIndex -> [cloneIndex]
        };

        let state = loadState();
        let currentRoom = state.activeRoom || 0;
        let typingTimeout = null;
        let emojiPickerOpen = false;

        // ─── LOAD / SAVE ───
        function loadState() {
            try {
                const raw = localStorage.getItem('nexusChatState');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...parsed };
                }
            } catch (_) { /* ignore */ }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        function saveState() {
            try {
                localStorage.setItem('nexusChatState', JSON.stringify(state));
            } catch (_) { /* ignore */ }
        }

        // ─── HELPERS ───
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        function now() { return new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' }); }

        function toast(title, msg, icon = '✨', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerHTML = `
            <span class="toast-icon">${icon}</span>
            <div class="toast-body">
              <div class="toast-title">${title}</div>
              <div>${msg}</div>
            </div>
            <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
          `;
            container.appendChild(el);
            setTimeout(() => { if (el.parentElement) el.remove(); }, duration);
        }

        function getRoomName(idx) {
            if (idx < CATEGORIES.length) return CATEGORIES[idx].name;
            return `Room ${idx}`;
        }

        function getRoomIcon(idx) {
            if (idx < CATEGORIES.length) return CATEGORIES[idx].icon;
            return '🧬';
        }

        function getRoomColor(idx) {
            if (idx < CATEGORIES.length) return CATEGORIES[idx].color;
            return '#ffffff';
        }

        // ─━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER
        // ─━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderAll() {
            renderChannelList();
            renderMessages();
            renderContacts();
            updateHeader();
            updateBadges();
        }

        function renderChannelList() {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            CATEGORIES.forEach((cat, idx) => {
                const item = document.createElement('div');
                item.className = `channel-item ${idx === currentRoom ? 'active' : ''}`;
                item.dataset.idx = idx;
                const msgs = state.messages[idx] || [];
                const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                item.innerHTML = `
              <span class="icon">${cat.icon}</span>
              <div class="info">
                <div class="name">${cat.name}</div>
                <div class="preview">${last ? last.text : 'No messages yet'}</div>
              </div>
              ${msgs.length > 0 ? `<span class="badge">${msgs.length}</span>` : ''}
            `;
                item.addEventListener('click', () => switchRoom(idx));
                list.appendChild(item);
            });
        }

        function renderMessages() {
            const area = document.getElementById('messageArea');
            area.innerHTML = '';
            const msgs = state.messages[currentRoom] || [];
            if (msgs.length === 0) {
                const sys = document.createElement('div');
                sys.className = 'msg system';
                sys.innerText = `✦ Welcome to ${getRoomName(currentRoom)} corridor. Type to start.`;
                area.appendChild(sys);
            } else {
                msgs.forEach((m, i) => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.type || 'bot'}`;
                    if (m.future) div.classList.add('future');
                    div.innerHTML = `
                ${m.text}
                <div class="meta">
                  <span>${m.from || 'SYSTEM'}</span>
                  <span class="time">${m.time || ''}</span>
                  ${m.reactions && m.reactions.length ? `<span>${m.reactions.join(' ')}</span>` : ''}
                </div>
              `;
                    // reactions
                    const reactionsDiv = document.createElement('div');
                    reactionsDiv.className = 'reactions';
                    const emojis = ['❤️', '🔥', '😂', '😮', '👏', '💯'];
                    emojis.forEach(e => {
                        const span = document.createElement('span');
                        span.innerText = e;
                        span.onclick = () => addReaction(currentRoom, i, e);
                        reactionsDiv.appendChild(span);
                    });
                    div.appendChild(reactionsDiv);
                    area.appendChild(div);
                });
            }
            area.scrollTop = area.scrollHeight;
        }

        function renderContacts() {
            const list = document.getElementById('contactList');
            list.innerHTML = '';
            state.contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = 'contact-item';
                item.innerHTML = `
              <span class="avatar">${c.avatar || '👤'}</span>
              <div class="info">
                <div class="name">${c.name}</div>
                <div class="status">${c.status}</div>
              </div>
              <span class="dot ${c.status}"></span>
            `;
                item.addEventListener('click', () => {
                    toast('👤 Contact', `Chat with ${c.name}`, '💬');
                });
                list.appendChild(item);
            });
        }

        function updateHeader() {
            const icon = document.getElementById('roomIcon');
            const title = document.getElementById('roomTitle');
            const sub = document.getElementById('roomSub');
            icon.textContent = getRoomIcon(currentRoom);
            title.textContent = getRoomName(currentRoom);
            const online = state.contacts.filter(c => c.status === 'online').length;
            sub.textContent = `● ${online} online · ${CATEGORIES.length} rooms`;
            document.getElementById('roomIcon').style.color = getRoomColor(currentRoom);
        }

        function updateBadges() {
            const total = Object.values(state.messages).reduce((a, b) => a + (b ? b.length : 0), 0);
            // we could show badge on channel list
        }

        // ─── SWITCH ROOM ───
        function switchRoom(idx) {
            if (idx === currentRoom) return;
            currentRoom = idx;
            state.activeRoom = idx;
            saveState();
            renderAll();
            // close mobile sidebar
            if (window.innerWidth <= 640) {
                document.getElementById('sidebarChannels').classList.remove('open');
            }
        }

        // ─── SEND MESSAGE ───
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (!state.messages[currentRoom]) state.messages[currentRoom] = [];
            const msg = { text, from: 'YOU', time: now(), type: 'self', reactions: [] };
            state.messages[currentRoom].push(msg);
            saveState();
            renderMessages();
            input.value = '';
            input.style.height = '40px';

            // bot reply
            showTyping();
            setTimeout(() => {
                hideTyping();
                const replies = [
                    `"${text}" processed.`, `Acknowledged.`, `Roger that.`, `✅ Done.`,
                    `Neon levels adjusted.`, `Command received.`, `Syncing...`
                ];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                if (!state.messages[currentRoom]) state.messages[currentRoom] = [];
                state.messages[currentRoom].push({
                    text: reply,
                    from: getRoomName(currentRoom),
                    time: now(),
                    type: 'bot',
                    reactions: []
                });
                saveState();
                renderMessages();
                // update channel preview
                renderChannelList();
            }, 800 + Math.random() * 600);
        }

        function handleInputKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
            // auto-resize
            const el = e.target;
            el.style.height = '40px';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'flex';
        }

        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function addReaction(roomIdx, msgIdx, emoji) {
            const msgs = state.messages[roomIdx];
            if (!msgs || !msgs[msgIdx]) return;
            if (!msgs[msgIdx].reactions) msgs[msgIdx].reactions = [];
            if (!msgs[msgIdx].reactions.includes(emoji)) {
                msgs[msgIdx].reactions.push(emoji);
                saveState();
                renderMessages();
            }
        }

        // ─── EMOJI PICKER ───
        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            emojiPickerOpen = !emojiPickerOpen;
            picker.classList.toggle('open', emojiPickerOpen);
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
            input.selectionStart = input.selectionEnd = start + emoji.length;
            input.focus();
            toggleEmojiPicker();
        }

        // ─── CLONE ROOM ───
        function cloneCurrentRoom() {
            const cat = CATEGORIES[currentRoom];
            const newName = `${cat.name} Clone`;
            const newIdx = CATEGORIES.length;
            CATEGORIES.push({ name: newName, icon: '🧬', color: cat.color });
            if (!state.messages[currentRoom]) state.messages[currentRoom] = [];
            state.messages[newIdx] = state.messages[currentRoom].map(m => ({ ...m }));
            if (!state.roomClones) state.roomClones = {};
            if (!state.roomClones[currentRoom]) state.roomClones[currentRoom] = [];
            state.roomClones[currentRoom].push(newIdx);
            saveState();
            renderAll();
            toast('🧬 Clone', `Room "${cat.name}" duplicated as "${newName}"`, '🧬');
        }

        // ─── PARTY MODE ───
        function toggleParty() {
            state.party = !state.party;
            document.body.classList.toggle('party-active', state.party);
            const btn = document.getElementById('partyBtn');
            if (state.party) {
                btn.innerText = '🎉 DANCE';
                btn.classList.add('active');
            } else {
                btn.innerText = '🎉 PARTY';
                btn.classList.remove('active');
            }
            saveState();
            toast('🎉 Party', state.party ? 'PARTY MODE ACTIVATED' : 'Party mode deactivated', state.party ? '🎉' : '💤');
        }

        // ─── SIDEBAR TOGGLE ───
        document.getElementById('toggleChannels').addEventListener('click', () => {
            document.getElementById('sidebarChannels').classList.toggle('open');
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('sidebarChannels').classList.toggle('open');
        });

        // Click outside to close emoji picker
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-picker') && !e.target.closest('.emoji-btn')) {
                document.getElementById('emojiPicker').classList.remove('open');
                emojiPickerOpen = false;
            }
        });

        // ─━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MODAL SYSTEM
        // ─━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const overlay = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');

        function openModal(tab, data = {}) {
            overlay.classList.add('open');
            let html = '';
            switch (tab) {
                case 'dashboard':
                    html = renderDashboardModal();
                    break;
                case 'contacts':
                    html = renderContactsModal();
                    break;
                case 'groups':
                    html = renderGroupsModal();
                    break;
                case 'admin':
                    html = renderAdminModal();
                    break;
                case 'settings':
                    html = renderSettingsModal();
                    break;
                case 'forward':
                    html = renderForwardModal(data);
                    break;
                case 'facetime':
                    html = renderFaceTimeModal();
                    break;
                default:
                    html = `<h2>✨ ${tab} <button class="close-btn">✕</button></h2><p>Feature coming soon.</p>`;
            }
            content.innerHTML = html;
            content.querySelector('.close-btn')?.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
        }

        function closeModal() {
            overlay.classList.remove('open');
        }

        // ─── MODAL RENDERERS ───
        function renderDashboardModal() {
            const total = Object.values(state.messages).reduce((a, b) => a + (b ? b.length : 0), 0);
            const future = state.futureMessages ? state.futureMessages.length : 0;
            const contacts = state.contacts.length;
            const groups = state.groups.length;
            return `
            <h2>📊 Dashboard <button class="close-btn">✕</button></h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;">
              <div style="background:var(--bg);padding:16px;border-radius:12px;border:1px solid var(--border);">
                <div style="font-size:0.6rem;color:var(--text-dim);">ROOMS</div>
                <div style="font-size:1.8rem;font-weight:700;">${CATEGORIES.length}</div>
              </div>
              <div style="background:var(--bg);padding:16px;border-radius:12px;border:1px solid var(--border);">
                <div style="font-size:0.6rem;color:var(--text-dim);">MESSAGES</div>
                <div style="font-size:1.8rem;font-weight:700;">${total}</div>
              </div>
              <div style="background:var(--bg);padding:16px;border-radius:12px;border:1px solid var(--border);">
                <div style="font-size:0.6rem;color:var(--text-dim);">CONTACTS</div>
                <div style="font-size:1.8rem;font-weight:700;">${contacts}</div>
              </div>
              <div style="background:var(--bg);padding:16px;border-radius:12px;border:1px solid var(--border);">
                <div style="font-size:0.6rem;color:var(--text-dim);">FUTURE</div>
                <div style="font-size:1.8rem;font-weight:700;">${future}</div>
              </div>
            </div>
            <div style="margin-top:16px;font-size:0.8rem;color:var(--text-dim);">
              <span class="tag-sm">Theme: ${state.theme}</span>
              <span class="tag-sm" style="margin-left:8px;">Font: ${state.font}</span>
              <span class="tag-sm" style="margin-left:8px;">Party: ${state.party ? '🎉 ON' : 'OFF'}</span>
              <span class="tag-sm" style="margin-left:8px;">Active: ${getRoomName(currentRoom)}</span>
            </div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="closeModal();toggleParty();">🎉 Toggle Party</button>
              <button class="btn-secondary" onclick="closeModal();">Close</button>
            </div>
          `;
        }

        function renderContactsModal() {
            let list = state.contacts.map(c =>
                `<div class="item">
              <span>${c.avatar || '👤'} ${c.name}</span>
              <span class="tag">${c.status}</span>
            </div>`
            ).join('');
            return `
            <h2>👥 Contacts <button class="close-btn">✕</button></h2>
            <div class="item-list">${list || '<div class="item" style="color:var(--text-dim);padding:12px;">No contacts yet.</div>'}</div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="addContact()">➕ Add Contact</button>
              <button class="btn-secondary" onclick="closeModal();">Close</button>
            </div>
          `;
        }

        function renderGroupsModal() {
            let list = state.groups.map(g =>
                `<div class="item">
              <span>📁 ${g.name}</span>
              <span class="tag">${g.members.length} members · ${g.roomIds.length} rooms</span>
            </div>`
            ).join('');
            return `
            <h2>📁 Groups <button class="close-btn">✕</button></h2>
            <div class="item-list">${list || '<div class="item" style="color:var(--text-dim);padding:12px;">No groups yet.</div>'}</div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="addGroup()">➕ New Group</button>
              <button class="btn-secondary" onclick="closeModal();">Close</button>
            </div>
          `;
        }

        function renderAdminModal() {
            const pending = state.adminRequests.filter(r => r.status === 'pending');
            let list = pending.map(r =>
                `<div class="item">
              <span>${r.userName}</span>
              <span style="font-size:0.7rem;color:var(--text-dim);">${r.reason}</span>
              <span>
                <button onclick="approveAdmin('${r.id}')" style="background:var(--n3);color:#000;border:none;padding:2px 10px;border-radius:20px;cursor:pointer;font-size:0.6rem;">✓</button>
                <button onclick="denyAdmin('${r.id}')" style="background:#ff6b6b;color:#fff;border:none;padding:2px 10px;border-radius:20px;cursor:pointer;font-size:0.6rem;">✕</button>
              </span>
            </div>`
            ).join('');
            return `
            <h2>⚙️ Admin Manager <button class="close-btn">✕</button></h2>
            <label>Pending Requests</label>
            <div class="item-list">${list || '<div class="item" style="color:var(--text-dim);padding:12px;">No pending requests.</div>'}</div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="requestAdmin()">📩 Request Admin</button>
              <button class="btn-secondary" onclick="closeModal();">Close</button>
            </div>
          `;
        }

        function renderSettingsModal() {
            const themes = ['dark', 'light', 'neon', 'amber'];
            const fonts = ['inter', 'space', 'exo', 'mono'];
            return `
            <h2>🎛️ Settings <button class="close-btn">✕</button></h2>
            <label>Theme</label>
            <select id="themeSelect" onchange="applyTheme(this.value)">
              ${themes.map(t => `<option value="${t}" ${state.theme === t ? 'selected' : ''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
            </select>
            <label>Font</label>
            <select id="fontSelect" onchange="applyFont(this.value)">
              ${fonts.map(f => `<option value="${f}" ${state.font === f ? 'selected' : ''}>${f.charAt(0).toUpperCase()+f.slice(1)}</option>`).join('')}
            </select>
            <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="resetState()">🔄 Reset State</button>
              <button class="btn-secondary" onclick="closeModal();">Close</button>
            </div>
            <div style="margin-top:12px;font-size:0.7rem;color:var(--text-dim);">
              Data stored in localStorage. Reset clears all custom data.
            </div>
          `;
        }

        function renderForwardModal(data) {
            const roomOpts = CATEGORIES.map((c, i) =>
                `<option value="${i}" ${i === currentRoom ? 'selected' : ''}>${c.icon} ${c.name}</option>`
            ).join('');
            return `
            <h2>📨 Forward to Future <button class="close-btn">✕</button></h2>
            <label>Room</label>
            <select id="forwardRoomSelect">${roomOpts}</select>
            <label>Message</label>
            <textarea id="forwardMsg" placeholder="Write a message to the future..."></textarea>
            <label>Deliver at (date & time)</label>
            <input type="datetime-local" id="forwardTime" value="${new Date(Date.now()+3600000).toISOString().slice(0,16)}" />
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-primary" onclick="scheduleForward()">📨 Schedule</button>
              <button class="btn-secondary" onclick="closeModal();">Cancel</button>
            </div>
          `;
        }

        function renderFaceTimeModal() {
            const users = state.contacts.length > 0 ? state.contacts : [
                { id: 'demo1', name: 'Neon Girl', avatar: '👩‍💻', status: 'online' },
                { id: 'demo2', name: 'Cyber Pup', avatar: '🐕', status: 'away' },
                { id: 'demo3', name: 'Void Walker', avatar: '🧙', status: 'online' },
                { id: 'demo4', name: 'Glitch Queen', avatar: '👾', status: 'offline' },
            ];
            const cards = users.map(u =>
                `<div class="swipe-card" data-id="${u.id}" style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:0.3s;">
              <div style="font-size:3.2rem;">${u.avatar || '👤'}</div>
              <div style="font-family:var(--font-header);font-size:1.1rem;letter-spacing:2px;margin-top:6px;">${u.name}</div>
              <div style="font-size:0.7rem;color:var(--text-dim);">${u.status} · ${Math.floor(Math.random()*999)+1} km away</div>
            </div>`
            ).join('');
            return `
            <h2>📹 FaceTime Swipe <button class="close-btn">✕</button></h2>
            <p style="font-size:0.8rem;color:var(--text-dim);">Swipe right to connect, left to pass. Random match every time.</p>
            <div class="swipe-container" id="swipeContainer" style="position:relative;height:260px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);overflow:hidden;">
              ${cards}
            </div>
            <div class="swipe-actions" style="display:flex;justify-content:center;gap:30px;margin-top:16px;">
              <button class="swipe-nope" onclick="swipeAction('nope')" style="width:56px;height:56px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.6rem;cursor:pointer;transition:0.2s;">✕</button>
              <button class="swipe-yep" onclick="swipeAction('yep')" style="width:56px;height:56px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.6rem;cursor:pointer;transition:0.2s;">❤️</button>
            </div>
            <div style="margin-top:12px;font-size:0.7rem;color:var(--text-dim);text-align:center;" id="swipeStatus">Swipe to connect</div>
          `;
        }

        // ─── MODAL ACTIONS ───
        function addContact() {
            const name = prompt('Contact name:');
            if (name && name.trim()) {
                state.contacts.push({ id: uid(), name: name.trim(), status: 'offline', avatar: '👤' });
                saveState();
                renderAll();
                openModal('contacts');
                toast('👤 Contact', `${name} added.`, '👤');
            }
        }

        function addGroup() {
            const name = prompt('Group name:');
            if (name && name.trim()) {
                state.groups.push({ id: uid(), name: name.trim(), members: [], roomIds: [] });
                saveState();
                renderAll();
                openModal('groups');
                toast('📁 Group', `"${name}" created.`, '📁');
            }
        }

        function requestAdmin() {
            const reason = prompt('Why do you want admin access?');
            if (reason && reason.trim()) {
                state.adminRequests.push({ id: uid(), userId: 'user_' + uid(), userName: 'You', reason: reason.trim(),
                    status: 'pending' });
                saveState();
                renderAll();
                openModal('admin');
                toast('📩 Admin Request', 'Request submitted for review.', '📩');
            }
        }

        function approveAdmin(id) {
            const req = state.adminRequests.find(r => r.id === id);
            if (req) { req.status = 'approved';
                saveState();
                renderAll();
                openModal('admin');
                toast('✅ Admin', `${req.userName} is now an admin.`, '✅'); }
        }

        function denyAdmin(id) {
            const req = state.adminRequests.find(r => r.id === id);
            if (req) { req.status = 'denied';
                saveState();
                renderAll();
                openModal('admin');
                toast('❌ Admin', `${req.userName} request denied.`, '❌'); }
        }

        function applyTheme(val) {
            document.body.className = document.body.className.replace(/theme-\w+/g, '');
            document.body.classList.add(`theme-${val}`);
            state.theme = val;
            saveState();
        }

        function applyFont(val) {
            document.body.className = document.body.className.replace(/font-\w+/g, '');
            document.body.classList.add(`font-${val}`);
            state.font = val;
            saveState();
        }

        function resetState() {
            if (confirm('Reset all data? This cannot be undone.')) {
                localStorage.removeItem('nexusChatState');
                state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                currentRoom = 0;
                renderAll();
                closeModal();
                toast('🔄 Reset', 'State has been reset to defaults.', '🔄');
            }
        }

        function scheduleForward() {
            const roomIdx = parseInt(document.getElementById('forwardRoomSelect').value);
            const text = document.getElementById('forwardMsg').value.trim();
            const deliverAt = document.getElementById('forwardTime').value;
            if (!text) { toast('⚠️ Error', 'Please write a message.', '⚠️'); return; }
            if (!deliverAt) { toast('⚠️ Error', 'Please pick a delivery time.', '⚠️'); return; }
            const dt = new Date(deliverAt);
            if (dt <= new Date()) { toast('⚠️ Error', 'Delivery time must be in the future.', '⚠️'); return; }
            if (!state.futureMessages) state.futureMessages = [];
            state.futureMessages.push({ id: uid(), text, roomIdx, deliverAt: dt.toISOString(), from: 'YOU',
                delivered: false });
            saveState();
            closeModal();
            toast('📨 Forward', `Message scheduled for ${dt.toLocaleString()}`, '📨');
            checkFutureMessages();
        }

        function swipeAction(dir) {
            const container = document.getElementById('swipeContainer');
            if (!container) return;
            const cards = container.querySelectorAll('.swipe-card');
            if (cards.length === 0) return;
            const current = cards[0];
            const name = current?.querySelector('div:nth-child(2)')?.textContent || 'User';
            if (dir === 'yep') {
                toast('❤️ Match!', `You connected with ${name}! 🎉`, '❤️');
                const id = current?.dataset?.id;
                if (id && !state.contacts.find(c => c.id === id)) {
                    const avatar = current.querySelector('div:first-child')?.textContent || '👤';
                    state.contacts.push({ id, name, status: 'online', avatar });
                    saveState();
                    renderAll();
                }
            } else {
                toast('👋 Pass', `Skipped ${name}`, '👋');
            }
            if (current) {
                current.style.transform = dir === 'yep' ? 'translateX(300px) rotate(10deg)' :
                    'translateX(-300px) rotate(-10deg)';
                current.style.opacity = '0';
                setTimeout(() => { if (current.parentElement) current.remove(); }, 300);
            }
            const status = document.getElementById('swipeStatus');
            const remaining = container.querySelectorAll('.swipe-card').length;
            if (remaining === 0) {
                status.textContent = '✨ No more profiles. Close and reopen to shuffle!';
            } else {
                status.textContent = `${remaining} profiles remaining`;
            }
        }

        // ─── CHECK FUTURE MESSAGES ───
        function checkFutureMessages() {
            if (!state.futureMessages) return;
            const now = new Date();
            let changed = false;
            state.futureMessages.forEach(fm => {
                if (!fm.delivered && new Date(fm.deliverAt) <= now) {
                    fm.delivered = true;
                    changed = true;
                    if (!state.messages[fm.roomIdx]) state.messages[fm.roomIdx] = [];
                    state.messages[fm.roomIdx].push({
                        text: `[FUTURE] ${fm.text}`,
                        from: `📨 ${fm.from}`,
                        time: now.toLocaleTimeString(),
                        type: 'future',
                        reactions: [],
                        future: true
                    });
                    toast('📨 Future Message', `Delivered to ${getRoomName(fm.roomIdx)}`, '📨');
                }
            });
            if (changed) {
                saveState();
                renderAll();
            }
            setTimeout(checkFutureMessages, 10000);
        }

        // ─── CLOSE SIDEBAR ───
        function closeSidebar(id) {
            document.getElementById(id).classList.remove('open');
        }

        // ─━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ─━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        applyTheme(state.theme);
        applyFont(state.font);
        if (state.party) {
            document.body.classList.add('party-active');
            document.getElementById('partyBtn').innerText = '🎉 DANCE';
            document.getElementById('partyBtn').classList.add('active');
        }

        renderAll();
        checkFutureMessages();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // expose globals
        window.switchRoom = switchRoom;
        window.sendMessage = sendMessage;
        window.toggleParty = toggleParty;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.cloneCurrentRoom = cloneCurrentRoom;
        window.addContact = addContact;
        window.addGroup = addGroup;
        window.requestAdmin = requestAdmin;
        window.approveAdmin = approveAdmin;
        window.denyAdmin = denyAdmin;
        window.applyTheme = applyTheme;
        window.applyFont = applyFont;
        window.resetState = resetState;
        window.scheduleForward = scheduleForward;
        window.swipeAction = swipeAction;
        window.toggleEmojiPicker = toggleEmojiPicker;
        window.insertEmoji = insertEmoji;
        window.handleInputKey = handleInputKey;
        window.closeSidebar = closeSidebar;
        window.toast = toast;
        window.renderAll = renderAll;

        console.log('🚀 NEON NEXUS CHAT HUB v2.0');
        console.log('📊 State:', state);
    </script>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(reg => console.log('SW registered:', reg.scope))
    .catch(err => console.warn('SW failed:', err));
}
</script>
</body>
</html>

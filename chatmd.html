<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#08080e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>NEXUS · Entertainment Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   NEXUS · ENTERTAINMENT CHAT · v5.1
   ═══════════════════════════════════════════════════════════════════════ */

/* ── RESET ───────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:var(--bg-0);color:var(--t-1);font-family:var(--ff);
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  transition:background .3s var(--e),color .3s var(--e);
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
a{color:var(--acc-3);text-decoration:none;}
a:hover{text-decoration:underline;}
img{max-width:100%;display:block;}
::selection{background:color-mix(in srgb,var(--acc) 40%,transparent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--t-4);}

/* ── ROOT + AURORA (default theme baked into :root so nothing looks plain) ── */
:root{
  --bg-0:#08080e; --bg-1:#0e0e18; --bg-2:#161622; --bg-3:#1e1e2c; --bg-4:#272736;
  --feed-bg:#0a0a13; --post-bg:#1a1a28;
  --line-1:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11); --line-3:rgba(255,255,255,.18);
  --t-0:#ffffff; --t-1:#eaeaf4; --t-2:#a8a8c0; --t-3:#787890; --t-4:#525266;
  --acc:#8b5cf6; --acc-2:#ec4899; --acc-3:#06b6d4; --acc-4:#f59e0b;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --live:#ff2d55;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --grad-2:linear-gradient(135deg,#06b6d4 0%,#8b5cf6 100%);
  --grad-3:linear-gradient(135deg,#8b5cf6,#ec4899,#06b6d4);
  --sh-sm:0 1px 3px rgba(0,0,0,.4);
  --sh-md:0 6px 20px rgba(0,0,0,.5);
  --sh-lg:0 14px 56px rgba(0,0,0,.65);
  --sh-xl:0 24px 80px rgba(0,0,0,.75);
  --glow:0 0 40px rgba(139,92,246,.35);
  --glow-strong:0 0 60px rgba(139,92,246,.5);
  --r-xs:7px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-full:999px;
  --ff:'Inter',system-ui,sans-serif;
  --fd:'Outfit',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
  --e:cubic-bezier(.4,0,.2,1);
  --e-out:cubic-bezier(.16,1,.3,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);
  --rail-w:76px; --side-w:272px; --right-w:300px; --nav-h:0px;
  --party-c1:rgba(139,92,246,.55); --party-c2:rgba(236,72,153,.35); --party-c3:rgba(6,182,212,.25);
}

/* ── THEMES ─────────────────────────────────────────────────────── */
body.t-aurora{
  --bg-0:#08080e; --bg-1:#0e0e18; --bg-2:#161622; --bg-3:#1e1e2c; --bg-4:#272736;
  --feed-bg:#0a0a13; --post-bg:#1a1a28;
  --acc:#8b5cf6; --acc-2:#ec4899; --acc-3:#06b6d4;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --grad-2:linear-gradient(135deg,#06b6d4 0%,#8b5cf6 100%);
  --glow:0 0 40px rgba(139,92,246,.35);
  --glow-strong:0 0 60px rgba(139,92,246,.5);
  --party-c1:rgba(139,92,246,.55); --party-c2:rgba(236,72,153,.35); --party-c3:rgba(6,182,212,.25);
}
body.t-midnight{
  --bg-0:#050810; --bg-1:#0a0f1e; --bg-2:#101828; --bg-3:#17213a; --bg-4:#1f2a48;
  --feed-bg:#060a16; --post-bg:#0f1729;
  --acc:#3b82f6; --acc-2:#06b6d4; --acc-3:#8b5cf6;
  --grad:linear-gradient(135deg,#3b82f6 0%,#06b6d4 100%);
  --grad-2:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%);
  --glow:0 0 40px rgba(59,130,246,.4);
  --glow-strong:0 0 60px rgba(59,130,246,.55);
  --party-c1:rgba(59,130,246,.55); --party-c2:rgba(6,182,212,.35); --party-c3:rgba(139,92,246,.25);
}
body.t-ember{
  --bg-0:#120806; --bg-1:#1a0c09; --bg-2:#25120d; --bg-3:#321814; --bg-4:#43201a;
  --feed-bg:#0e0604; --post-bg:#200f0b;
  --acc:#f97316; --acc-2:#ef4444; --acc-3:#f59e0b;
  --grad:linear-gradient(135deg,#f97316 0%,#ef4444 100%);
  --grad-2:linear-gradient(135deg,#f59e0b 0%,#f97316 100%);
  --glow:0 0 40px rgba(249,115,22,.4);
  --glow-strong:0 0 60px rgba(249,115,22,.55);
  --party-c1:rgba(249,115,22,.55); --party-c2:rgba(239,68,68,.35); --party-c3:rgba(245,158,11,.25);
}
body.t-forest{
  --bg-0:#050e0a; --bg-1:#0a1712; --bg-2:#0f221b; --bg-3:#153024; --bg-4:#1d4030;
  --feed-bg:#040c08; --post-bg:#0e2018;
  --acc:#10b981; --acc-2:#84cc16; --acc-3:#06b6d4;
  --grad:linear-gradient(135deg,#10b981 0%,#84cc16 100%);
  --grad-2:linear-gradient(135deg,#06b6d4 0%,#10b981 100%);
  --glow:0 0 40px rgba(16,185,129,.4);
  --glow-strong:0 0 60px rgba(16,185,129,.55);
  --party-c1:rgba(16,185,129,.55); --party-c2:rgba(132,204,22,.35); --party-c3:rgba(6,182,212,.25);
}
body.t-candy{
  --bg-0:#1c0d20; --bg-1:#25132a; --bg-2:#301a38; --bg-3:#3e2448; --bg-4:#4e2f58;
  --feed-bg:#1a0c1e; --post-bg:#2c1833;
  --acc:#f472b6; --acc-2:#c084fc; --acc-3:#fb7185;
  --grad:linear-gradient(135deg,#f472b6 0%,#c084fc 100%);
  --grad-2:linear-gradient(135deg,#fb7185 0%,#c084fc 100%);
  --glow:0 0 40px rgba(244,114,182,.4);
  --glow-strong:0 0 60px rgba(244,114,182,.55);
  --party-c1:rgba(244,114,182,.55); --party-c2:rgba(192,132,252,.35); --party-c3:rgba(251,113,133,.25);
}
body.t-cyber{
  --bg-0:#030508; --bg-1:#070c15; --bg-2:#0a1220; --bg-3:#101a2e; --bg-4:#172440;
  --feed-bg:#020408; --post-bg:#091220;
  --acc:#facc15; --acc-2:#06b6d4; --acc-3:#ec4899;
  --grad:linear-gradient(135deg,#facc15 0%,#06b6d4 100%);
  --grad-2:linear-gradient(135deg,#06b6d4 0%,#ec4899 100%);
  --glow:0 0 40px rgba(250,204,21,.4);
  --glow-strong:0 0 60px rgba(250,204,21,.55);
  --party-c1:rgba(250,204,21,.55); --party-c2:rgba(6,182,212,.35); --party-c3:rgba(236,72,153,.25);
}
body.t-mono{
  --bg-0:#0a0a0a; --bg-1:#111; --bg-2:#1a1a1a; --bg-3:#242424; --bg-4:#303030;
  --feed-bg:#0d0d0d; --post-bg:#1c1c1c;
  --t-0:#fff; --t-1:#e0e0e0; --t-2:#b0b0b0; --t-3:#808080;
  --acc:#e5e5e5; --acc-2:#a3a3a3; --acc-3:#737373;
  --grad:linear-gradient(135deg,#e5e5e5 0%,#737373 100%);
  --grad-2:linear-gradient(135deg,#a3a3a3 0%,#525252 100%);
  --glow:0 0 40px rgba(229,229,229,.2);
  --glow-strong:0 0 60px rgba(229,229,229,.35);
  --party-c1:rgba(229,229,229,.5); --party-c2:rgba(163,163,163,.3); --party-c3:rgba(115,115,115,.22);
}

/* ── SHELL ──────────────────────────────────────────────────────── */
.app{display:flex;height:100dvh;width:100vw;overflow:hidden;position:relative;isolation:isolate;}
.app::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 900px 700px at 12% 8%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 55%),
    radial-gradient(ellipse 700px 500px at 88% 92%,color-mix(in srgb,var(--acc-2) 10%,transparent),transparent 55%),
    radial-gradient(ellipse 500px 400px at 50% 50%,color-mix(in srgb,var(--acc-3) 5%,transparent),transparent 60%);
}
.app>*{position:relative;z-index:1;}

/* ── RAIL ───────────────────────────────────────────────────────── */
.rail{
  width:var(--rail-w);flex-shrink:0;
  background:linear-gradient(180deg,var(--bg-0),var(--bg-1));
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0 12px;gap:8px;border-right:1px solid var(--line-1);
  overflow-y:auto;overflow-x:hidden;
}
.rail::-webkit-scrollbar{width:0;}
.rail-btn{
  position:relative;width:48px;height:48px;border-radius:16px;
  display:grid;place-items:center;font-size:1.4rem;
  background:var(--bg-2);color:var(--t-2);
  border:1px solid var(--line-1);
  transition:transform .2s var(--e-spring),background .2s var(--e),
             color .2s var(--e),box-shadow .3s var(--e),border-radius .2s var(--e);
  flex-shrink:0;
}
.rail-btn:hover{
  border-radius:14px;transform:translateY(-2px);
  background:var(--bg-3);color:var(--t-0);
  border-color:var(--line-3);
}
.rail-btn.on{
  border-radius:14px;background:var(--grad);color:#fff;
  border-color:transparent;
  box-shadow:var(--glow-strong),0 6px 24px rgba(0,0,0,.4);
}
.rail-btn.on::before{
  content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:34px;border-radius:0 4px 4px 0;background:var(--t-0);
  box-shadow:0 0 12px rgba(255,255,255,.8);
}
.rail-btn .bdg{
  position:absolute;bottom:-4px;right:-4px;background:var(--bad);color:#fff;
  border-radius:var(--r-full);font-size:.62rem;font-weight:700;padding:2px 7px;
  border:2px solid var(--bg-0);min-width:20px;text-align:center;line-height:1.3;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.rail-btn .bdg.live{background:var(--live);animation:livePulse 2s infinite;}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.7;transform:scale(1.08);}}
.rail-btn .tip{
  position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) scale(.9);
  background:var(--bg-4);color:var(--t-0);padding:8px 14px;border-radius:var(--r-sm);
  font-size:.78rem;font-weight:500;white-space:nowrap;pointer-events:none;
  opacity:0;transition:all .2s var(--e);z-index:100;
  border:1px solid var(--line-2);box-shadow:var(--sh-md);
}
.rail-btn:hover .tip{opacity:1;transform:translateY(-50%) scale(1);}
.rail-div{width:30px;height:2px;background:var(--line-2);border-radius:2px;margin:6px 0;flex-shrink:0;}
.rail-add{
  width:48px;height:48px;border-radius:50%;background:var(--bg-2);
  border:1px dashed var(--line-3);color:var(--ok);font-size:1.5rem;font-weight:300;
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;
  transition:all .25s var(--e-spring);
}
.rail-add:hover{
  border-radius:14px;background:var(--ok);color:#000;
  border-style:solid;transform:rotate(90deg);
  box-shadow:0 0 30px rgba(16,185,129,.5);
}

/* ── SIDEBAR ────────────────────────────────────────────────────── */
.side{
  width:var(--side-w);flex-shrink:0;
  background:var(--bg-1);
  display:flex;flex-direction:column;
  border-right:1px solid var(--line-1);
  z-index:50;
  transition:transform .3s var(--e-out);
}
.side-head{
  height:62px;padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line-1);flex-shrink:0;gap:10px;
}
.side-head .ttl{
  font-family:var(--fd);font-weight:700;font-size:1.08rem;letter-spacing:.3px;
  color:var(--t-0);display:flex;align-items:center;gap:10px;min-width:0;
}
.side-head .ttl .ic{font-size:1.3rem;}
.side-head .ttl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side-head .btn{
  width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--t-3);font-size:1.05rem;transition:all .2s var(--e);
  border:1px solid var(--line-1);
}
.side-head .btn:hover{
  background:var(--grad);color:#fff;
  border-color:transparent;box-shadow:var(--glow);
}
.view-tabs{display:flex;gap:4px;padding:12px 14px 8px;flex-shrink:0;}
.view-tabs button{
  flex:1;padding:9px 6px;border-radius:var(--r-sm);font-size:.72rem;font-weight:600;
  color:var(--t-3);letter-spacing:.3px;transition:all .2s var(--e);
  text-transform:uppercase;border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.view-tabs button:hover{color:var(--t-2);background:var(--bg-2);}
.view-tabs button.on{
  background:color-mix(in srgb,var(--acc) 18%,transparent);
  color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);
  box-shadow:0 0 20px color-mix(in srgb,var(--acc) 25%,transparent);
}
.search-box{padding:8px 14px 12px;position:relative;flex-shrink:0;}
.search-box input{
  width:100%;background:var(--bg-0);border:1px solid var(--line-1);
  border-radius:var(--r-sm);padding:11px 14px 11px 40px;font-size:.85rem;
  color:var(--t-1);outline:none;transition:all .2s var(--e);
}
.search-box input:focus{
  border-color:var(--acc);background:var(--bg-2);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent);
}
.search-box input::placeholder{color:var(--t-4);}
.search-box .ic{
  position:absolute;left:28px;top:calc(50% - 3px);transform:translateY(-50%);
  color:var(--t-4);font-size:.95rem;pointer-events:none;
}

.list{flex:1;overflow-y:auto;padding:0 10px 12px;}
.list-sec{
  display:flex;align-items:center;gap:8px;padding:16px 10px 8px;
  font-size:.67rem;font-weight:700;color:var(--t-4);letter-spacing:.9px;
  text-transform:uppercase;cursor:pointer;user-select:none;transition:color .2s var(--e);
}
.list-sec:hover{color:var(--t-2);}
.list-sec .ar{font-size:.6rem;transition:transform .2s var(--e);}
.list-sec.collapsed .ar{transform:rotate(-90deg);}

.item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);
  cursor:pointer;transition:all .15s var(--e);color:var(--t-2);font-size:.88rem;
  border:1px solid transparent;position:relative;min-width:0;min-height:46px;
}
.item:hover{background:var(--bg-2);color:var(--t-0);}
.item.on{
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 15%,transparent),transparent);
  color:var(--t-0);border-color:color-mix(in srgb,var(--acc) 40%,transparent);
}
.item.on::before{
  content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;background:var(--acc);border-radius:3px;
  box-shadow:0 0 10px var(--acc);
}
.item .ico{font-size:1.2rem;flex-shrink:0;width:24px;text-align:center;}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.item.unread .nm{color:var(--t-0);font-weight:700;}
.item.muted{opacity:.5;}
.item .bdg{
  background:var(--bad);color:#fff;border-radius:var(--r-full);font-size:.65rem;
  font-weight:700;padding:2px 8px;min-width:20px;text-align:center;line-height:1.5;flex-shrink:0;
  box-shadow:0 2px 8px rgba(239,68,68,.4);
}
.item .live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--live);
  box-shadow:0 0 8px var(--live);flex-shrink:0;animation:livePulse 2s infinite;
}
.item .av{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:.9rem;flex-shrink:0;position:relative;
}
.item .av .st{
  position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;
  border-radius:50%;border:2px solid var(--bg-1);
}
.st.online{background:var(--ok);}
.st.away{background:var(--warn);}
.st.busy{background:var(--bad);}
.st.offline{background:var(--t-4);}
.st.live{background:var(--live);animation:livePulse 1.2s infinite;}

.me-bar{
  padding:14px;border-top:1px solid var(--line-1);
  display:flex;align-items:center;gap:12px;background:var(--bg-1);flex-shrink:0;
}
.me-av{
  width:42px;height:42px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;font-size:1.2rem;flex-shrink:0;
  cursor:pointer;position:relative;
  transition:transform .2s var(--e-spring),box-shadow .3s var(--e);
  box-shadow:0 4px 16px rgba(139,92,246,.4);
}
.me-av:hover{transform:scale(1.08);box-shadow:var(--glow-strong);}
.me-av .st{
  position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;
  border-radius:50%;border:3px solid var(--bg-1);background:var(--ok);
}
.me-info{flex:1;min-width:0;cursor:pointer;}
.me-info .n{font-size:.88rem;font-weight:700;color:var(--t-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me-info .t{font-size:.7rem;color:var(--t-3);font-family:var(--fm);}
.me-acts{display:flex;gap:4px;}
.me-acts button{
  width:36px;height:36px;border-radius:var(--r-xs);display:grid;place-items:center;
  color:var(--t-3);font-size:1rem;transition:all .2s var(--e);
  border:1px solid var(--line-1);
}
.me-acts button:hover{background:var(--bg-3);color:var(--t-0);border-color:var(--line-3);}

/* ── MAIN ───────────────────────────────────────────────────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-0);position:relative;}
.hdr{
  height:62px;padding:0 20px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--line-1);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg-1) 90%,transparent),color-mix(in srgb,var(--bg-0) 85%,transparent));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  flex-shrink:0;z-index:20;
}
.hdr .left{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
.hdr .back{
  display:none;width:40px;height:40px;border-radius:var(--r-sm);
  align-items:center;justify-content:center;color:var(--t-2);font-size:1.2rem;
  transition:all .2s var(--e);flex-shrink:0;
  border:1px solid var(--line-1);
}
.hdr .back:hover{background:var(--bg-3);color:var(--t-0);}
.hdr .ic{font-size:1.45rem;flex-shrink:0;}
.hdr .ttl{
  font-family:var(--fd);font-weight:700;font-size:1.1rem;color:var(--t-0);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;
}
.hdr .sub{
  font-size:.74rem;color:var(--t-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-left:12px;border-left:1px solid var(--line-2);
}
.hdr .right{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.ibtn{
  width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--t-3);font-size:1.1rem;
  transition:all .2s var(--e);position:relative;
  border:1px solid transparent;
}
.ibtn:hover{background:var(--bg-3);color:var(--t-0);border-color:var(--line-2);}
.ibtn.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);border-color:color-mix(in srgb,var(--acc) 40%,transparent);}
.ibtn.pri{
  background:var(--grad);color:#fff;width:auto;padding:0 18px;
  font-weight:600;font-size:.82rem;gap:7px;display:flex;align-items:center;
  box-shadow:0 4px 20px rgba(139,92,246,.45);
  border:none;
}
.ibtn.pri:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:var(--glow-strong);}

.pinned-bar{
  display:none;align-items:center;gap:12px;padding:11px 20px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc-4) 12%,var(--bg-1)),var(--bg-1));
  border-bottom:1px solid var(--line-1);font-size:.8rem;flex-shrink:0;
}
.pinned-bar.on{display:flex;animation:slideDown .25s var(--e-out);}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.pinned-bar .pi{color:var(--acc-4);font-size:1.05rem;flex-shrink:0;}
.pinned-bar .pb{flex:1;min-width:0;}
.pinned-bar .pb b{
  color:var(--acc-4);font-size:.7rem;text-transform:uppercase;
  letter-spacing:.6px;display:block;margin-bottom:2px;
}
.pinned-bar .pb span{
  color:var(--t-2);display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.pinned-bar button{
  color:var(--t-3);font-size:.85rem;padding:6px 10px;
  border-radius:var(--r-xs);transition:all .2s var(--e);min-height:36px;
}
.pinned-bar button:hover{color:var(--t-0);background:var(--bg-3);}

/* ── MESSAGES ───────────────────────────────────────────────────── */
.msgs{
  flex:1;overflow-y:auto;padding:22px 0 28px;
  scroll-behavior:smooth;position:relative;
  background:radial-gradient(ellipse at top,color-mix(in srgb,var(--acc) 3%,transparent),transparent 60%);
}
.day-div{
  display:flex;align-items:center;gap:14px;padding:20px 26px 8px;
  color:var(--t-4);font-size:.7rem;font-weight:600;letter-spacing:.9px;
  text-transform:uppercase;
}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--line-1);}

.msg{
  display:flex;gap:14px;padding:6px 26px;position:relative;
  border:1px solid transparent;border-radius:var(--r-md);
  margin:0 8px;
  transition:background .15s var(--e),border-color .3s var(--e),box-shadow .3s var(--e);
}
.msg:hover{background:color-mix(in srgb,var(--bg-2) 60%,transparent);}
.msg.grp{padding-top:2px;padding-bottom:2px;}
.msg.grp .av-w{visibility:hidden;height:0;}

.av-w{width:44px;flex-shrink:0;}
.av{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-size:1.2rem;font-weight:600;color:#fff;cursor:pointer;
  transition:transform .2s var(--e-spring),box-shadow .3s var(--e);
  position:relative;user-select:none;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.av:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,.5);}
.av .st{
  position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;
  border-radius:50%;border:3px solid var(--bg-0);
}
.av .vf{
  position:absolute;top:-3px;right:-3px;width:17px;height:17px;border-radius:50%;
  background:var(--acc-3);border:2px solid var(--bg-0);
  display:grid;place-items:center;font-size:.62rem;color:#fff;font-weight:700;
}
.av .live{
  position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  background:var(--live);color:#fff;font-size:.52rem;font-weight:800;
  padding:2px 6px;border-radius:3px;letter-spacing:.6px;
  border:2px solid var(--bg-0);
  box-shadow:0 0 12px var(--live);
}

.body{flex:1;min-width:0;position:relative;}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
.who{
  font-weight:700;font-size:.94rem;color:var(--t-0);
  cursor:pointer;transition:color .2s var(--e);
}
.who:hover{text-decoration:underline;}
.who.vf::after{
  content:'✓';display:inline-grid;place-items:center;width:15px;height:15px;
  background:var(--acc-3);color:#fff;border-radius:50%;font-size:.6rem;
  font-weight:700;margin-left:6px;vertical-align:middle;
}
.who.bot::after{
  content:'BOT';font-size:.55rem;background:var(--acc);color:#fff;
  padding:1px 6px;border-radius:3px;margin-left:6px;font-weight:700;
  letter-spacing:.5px;vertical-align:middle;
}
.who.role-mod{color:var(--acc-3);}
.who.role-admin{color:var(--acc-2);}
.who.role-owner{color:var(--acc-4);}
.tm{font-size:.72rem;color:var(--t-4);font-family:var(--fm);cursor:default;}
.edited{font-size:.66rem;color:var(--t-4);font-style:italic;}
.txt{
  font-size:.94rem;color:var(--t-1);line-height:1.62;
  word-wrap:break-word;word-break:break-word;white-space:pre-wrap;
}
.txt.emo{font-size:2.8rem;line-height:1.15;}

.txt code{
  font-family:var(--fm);font-size:.85em;background:var(--bg-3);
  padding:3px 8px;border-radius:var(--r-xs);color:var(--acc-3);
  border:1px solid var(--line-1);
}
.txt pre{
  background:var(--bg-0);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:14px 16px;margin:10px 0;overflow-x:auto;position:relative;
}
.txt pre code{background:none;border:none;padding:0;color:var(--t-1);font-size:.84rem;line-height:1.6;}
.txt pre .cc{
  position:absolute;top:8px;right:8px;background:var(--bg-3);
  border:1px solid var(--line-2);color:var(--t-2);font-size:.7rem;
  padding:4px 10px;border-radius:var(--r-xs);cursor:pointer;
  opacity:0;transition:opacity .2s var(--e);
}
.txt pre:hover .cc{opacity:1;}
.txt blockquote{
  border-left:3px solid var(--acc);padding:3px 0 3px 14px;margin:8px 0;
  color:var(--t-2);font-style:italic;
  background:color-mix(in srgb,var(--acc) 5%,transparent);
  border-radius:0 var(--r-xs) var(--r-xs) 0;
}
.txt .spoiler{
  background:var(--bg-4);color:transparent;border-radius:4px;padding:0 6px;
  cursor:pointer;transition:all .2s var(--e);user-select:none;
}
.txt .spoiler.rev{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--t-1);}
.txt .mention{
  color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent);
  padding:1px 6px;border-radius:6px;font-weight:600;cursor:pointer;
  transition:background .15s var(--e);
}
.txt .mention:hover{background:color-mix(in srgb,var(--acc) 30%,transparent);}
.txt .mention.me{color:var(--acc-4);background:color-mix(in srgb,var(--acc-4) 22%,transparent);}
.txt .clink{
  color:var(--acc-3);background:color-mix(in srgb,var(--acc-3) 15%,transparent);
  padding:1px 6px;border-radius:6px;font-weight:500;cursor:pointer;
}
.txt .clink:hover{background:color-mix(in srgb,var(--acc-3) 28%,transparent);}
.txt b{color:var(--t-0);}

.reply-ref{
  display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--t-3);
  margin-bottom:6px;cursor:pointer;padding:4px 8px;transition:all .15s var(--e);
  background:color-mix(in srgb,var(--bg-2) 60%,transparent);
  border-radius:var(--r-xs);border-left:2px solid var(--t-4);
}
.reply-ref:hover{color:var(--t-1);background:var(--bg-3);}
.reply-ref b{color:var(--t-2);font-weight:600;}
.reply-ref .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;flex:1;min-width:0;}

.att{margin-top:8px;max-width:440px;}
.att.image img{
  border-radius:var(--r-md);cursor:pointer;
  transition:transform .2s var(--e);border:1px solid var(--line-1);
}
.att.image img:hover{transform:scale(1.01);}
.att.file{
  display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg-2);
  border:1px solid var(--line-2);border-radius:var(--r-md);cursor:pointer;
  transition:all .2s var(--e);
}
.att.file:hover{border-color:var(--acc);background:var(--bg-3);}
.att.file .fi{
  width:46px;height:46px;border-radius:var(--r-sm);background:var(--grad-2);
  display:grid;place-items:center;font-size:1.25rem;flex-shrink:0;color:#fff;
}
.att.file .fm{flex:1;min-width:0;}
.att.file .fn{
  font-size:.86rem;font-weight:600;color:var(--t-0);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.att.file .fs{font-size:.7rem;color:var(--t-3);font-family:var(--fm);}

.att.voice{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:var(--r-lg);max-width:340px;
}
.att.voice .play{
  width:40px;height:40px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;color:#fff;font-size:.95rem;
  flex-shrink:0;cursor:pointer;transition:transform .2s var(--e-spring);
}
.att.voice .play:hover{transform:scale(1.1);}
.att.voice .wave{flex:1;display:flex;align-items:center;gap:2px;height:30px;}
.att.voice .wave i{
  width:3px;background:var(--t-3);border-radius:2px;transition:background .2s var(--e);
}
.att.voice.playing .wave i{background:var(--acc-3);}
.att.voice .dur{font-size:.74rem;color:var(--t-3);font-family:var(--fm);flex-shrink:0;}

.att.poll{display:flex;flex-direction:column;gap:8px;max-width:460px;margin-top:8px;}
.att.poll .q{font-weight:700;font-size:.92rem;color:var(--t-0);margin-bottom:4px;}
.att.poll .opt{
  position:relative;padding:12px 16px;border:1px solid var(--line-2);
  border-radius:var(--r-md);cursor:pointer;transition:all .2s var(--e);
  overflow:hidden;font-size:.86rem;
}
.att.poll .opt:hover{border-color:var(--acc);}
.att.poll .opt .bar{
  position:absolute;left:0;top:0;bottom:0;
  background:color-mix(in srgb,var(--acc) 20%,transparent);
  width:0;transition:width .5s var(--e-out);z-index:0;
}
.att.poll .opt .row{
  position:relative;z-index:1;display:flex;
  justify-content:space-between;align-items:center;gap:10px;
}
.att.poll .opt .txt{display:flex;align-items:center;gap:8px;}
.att.poll .opt .check{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--line-3);
  flex-shrink:0;display:grid;place-items:center;
  transition:all .2s var(--e);font-size:.65rem;color:transparent;
}
.att.poll .opt.voted .check{background:var(--acc);border-color:var(--acc);color:#fff;}
.att.poll .opt.voted{border-color:var(--acc);}
.att.poll .opt .pct{font-family:var(--fm);font-size:.74rem;color:var(--t-3);}
.att.poll .meta{font-size:.7rem;color:var(--t-4);display:flex;gap:10px;margin-top:4px;}

.rxns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.rxn{
  display:flex;align-items:center;gap:6px;padding:4px 11px;
  border-radius:var(--r-full);background:var(--bg-2);border:1px solid var(--line-1);
  font-size:.82rem;cursor:pointer;transition:all .18s var(--e-spring);user-select:none;
  min-height:34px;
}
.rxn:hover{border-color:var(--line-3);transform:translateY(-1px);background:var(--bg-3);}
.rxn.me{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc);}
.rxn .c{font-size:.72rem;font-weight:700;color:var(--t-2);font-family:var(--fm);}
.rxn.me .c{color:var(--acc);}
.rxn.add{padding:4px 10px;color:var(--t-4);border-style:dashed;}
.rxn.add:hover{color:var(--t-1);}

.tools{
  position:absolute;top:-18px;right:26px;display:flex;gap:2px;padding:4px;
  background:var(--bg-3);border:1px solid var(--line-2);
  border-radius:var(--r-md);box-shadow:var(--sh-md);
  opacity:0;pointer-events:none;transition:all .18s var(--e-spring);
  transform:translateY(4px) scale(.96);z-index:5;
}
.msg:hover .tools{opacity:1;pointer-events:auto;transform:translateY(0) scale(1);}
.tools button{
  width:34px;height:34px;border-radius:var(--r-xs);display:grid;place-items:center;
  color:var(--t-3);font-size:.95rem;transition:all .15s var(--e);
}
.tools button:hover{background:var(--bg-4);color:var(--t-0);}
.tools .sp{width:1px;background:var(--line-2);margin:4px 3px;}

.sys{display:flex;align-items:center;gap:10px;padding:8px 26px;color:var(--t-3);font-size:.78rem;}
.sys .i{color:var(--t-4);}
.sys b{color:var(--t-2);font-weight:600;}
.sys .t{font-size:.7rem;color:var(--t-4);font-family:var(--fm);margin-left:auto;}

.typing{
  padding:4px 26px 10px;font-size:.74rem;color:var(--t-3);
  display:none;align-items:center;gap:10px;flex-shrink:0;height:26px;
}
.typing.on{display:flex;}
.typing .d{display:inline-flex;gap:3px;}
.typing .d span{
  width:6px;height:6px;border-radius:50%;background:var(--acc);
  animation:tp 1.2s infinite;
}
.typing .d span:nth-child(2){animation-delay:.15s;}
.typing .d span:nth-child(3){animation-delay:.3s;}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

.empty{
  text-align:center;color:var(--t-4);padding:60px 30px;
  font-size:.92rem;line-height:1.9;
}
.empty .ic{font-size:3.8rem;margin-bottom:18px;opacity:.8;}
.empty .tt{font-size:1.15rem;color:var(--t-2);font-weight:600;margin-bottom:8px;}

/* ── FEED ───────────────────────────────────────────────────────── */
.feed{
  flex:1;overflow-y:auto;
  background:var(--feed-bg);
  display:none;flex-direction:column;
}
.feed.on{display:flex;}
.feed-wrap{max-width:640px;margin:0 auto;padding:24px 18px 40px;width:100%;}

.feed-composer{
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 8%,var(--post-bg)),var(--post-bg));
  border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line-2));
  border-radius:var(--r-lg);
  padding:20px;margin-bottom:24px;
  box-shadow:var(--sh-sm);
}
.feed-composer .row{display:flex;gap:14px;align-items:flex-start;}
.feed-composer .av{width:46px;height:46px;font-size:1.25rem;}
.feed-composer textarea{
  flex:1;background:transparent;border:none;outline:none;resize:none;
  font-size:.98rem;color:var(--t-0);padding:12px 0;min-height:56px;
  font-family:var(--ff);line-height:1.55;
}
.feed-composer textarea::placeholder{color:var(--t-4);}
.feed-composer .acts{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line-1);
}
.feed-composer .acts .ico-row{display:flex;gap:2px;}
.feed-composer .acts .ico-row button{
  width:40px;height:40px;border-radius:var(--r-sm);
  color:var(--t-2);font-size:1.15rem;
  display:grid;place-items:center;transition:all .15s var(--e);
}
.feed-composer .acts .ico-row button:hover{background:var(--bg-3);color:var(--acc);}

.post{
  background:var(--post-bg);
  border:1px solid var(--line-2);
  border-radius:var(--r-lg);
  padding:22px;margin-bottom:16px;
  transition:all .2s var(--e);
  box-shadow:var(--sh-sm);
}
.post:hover{
  border-color:color-mix(in srgb,var(--acc) 50%,var(--line-2));
  transform:translateY(-2px);
  box-shadow:var(--sh-md);
}
.post-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;}
.post-head .av{width:48px;height:48px;font-size:1.3rem;cursor:pointer;}
.post-head .info{flex:1;min-width:0;cursor:pointer;}
.post-head .nm{
  font-weight:700;font-size:1rem;color:var(--t-0);
  display:flex;align-items:center;gap:6px;
}
.post-head .vf{
  width:17px;height:17px;background:var(--acc-3);color:#fff;border-radius:50%;
  display:grid;place-items:center;font-size:.62rem;font-weight:700;
}
.post-head .mt{
  font-size:.8rem;color:var(--t-3);
  display:flex;gap:6px;align-items:center;margin-top:4px;
  flex-wrap:wrap;
}
.post-head .tag{
  font-size:.7rem;background:color-mix(in srgb,var(--acc) 22%,transparent);
  color:var(--acc);padding:2px 9px;border-radius:5px;font-weight:600;
}
.post-head .tag.live{
  background:color-mix(in srgb,var(--live) 25%,transparent);
  color:var(--live);
  animation:livePulse 2s infinite;
}
.post-head .more{
  color:var(--t-3);padding:6px 8px;border-radius:var(--r-xs);
  transition:all .15s var(--e);
}
.post-head .more:hover{background:var(--bg-3);color:var(--t-0);}
.post-body{
  font-size:.98rem;color:var(--t-0);line-height:1.7;
  margin-bottom:16px;white-space:pre-wrap;word-wrap:break-word;
}
.post-media{
  border-radius:var(--r-md);overflow:hidden;margin:16px 0;
  border:1px solid var(--line-1);
}
.post-media .placeholder{
  aspect-ratio:16/10;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--acc) 55%,var(--bg-3)) 0%,
    color-mix(in srgb,var(--acc-2) 45%,var(--bg-3)) 100%);
  display:grid;place-items:center;color:rgba(255,255,255,.95);
  font-size:3.2rem;
  text-shadow:0 4px 12px rgba(0,0,0,.5);
}
.post-stats{
  display:flex;gap:20px;font-size:.82rem;color:var(--t-2);
  padding:12px 0;border-bottom:1px solid var(--line-1);margin-bottom:8px;
}
.post-stats span{display:flex;align-items:center;gap:6px;}
.post-acts{display:flex;justify-content:space-around;padding-top:6px;}
.post-acts button{
  flex:1;padding:11px 0;border-radius:var(--r-sm);color:var(--t-2);
  font-size:.84rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s var(--e);min-height:46px;
}
.post-acts button:hover{background:var(--bg-3);color:var(--t-0);}
.post-acts button.liked{color:var(--acc-2);}
.post-acts button.liked .ic{filter:drop-shadow(0 0 10px var(--acc-2));}

/* ── THREADS ────────────────────────────────────────────────────── */
.threads-view{flex:1;overflow-y:auto;background:var(--bg-0);display:none;flex-direction:column;}
.threads-view.on{display:flex;}
.threads-wrap{max-width:760px;margin:0 auto;padding:28px 20px 40px;width:100%;}
.threads-head{margin-bottom:28px;}
.threads-head h1{
  font-family:var(--fd);font-size:1.8rem;font-weight:800;
  color:var(--t-0);letter-spacing:-.02em;margin-bottom:8px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.threads-head p{color:var(--t-3);font-size:.94rem;}
.thread-card{
  background:var(--post-bg);border:1px solid var(--line-2);
  border-radius:var(--r-lg);padding:22px;margin-bottom:14px;
  cursor:pointer;transition:all .2s var(--e);
}
.thread-card:hover{
  border-color:var(--acc);transform:translateY(-2px);
  box-shadow:var(--sh-md),0 0 40px color-mix(in srgb,var(--acc) 20%,transparent);
}
.thread-card .tc-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
.thread-card .tc-av{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-size:1.2rem;flex-shrink:0;position:relative;
}
.thread-card .tc-meta{flex:1;min-width:0;}
.thread-card .tc-name{
  font-weight:700;font-size:.94rem;color:var(--t-0);
  display:flex;align-items:center;gap:6px;
}
.thread-card .tc-time{font-size:.72rem;color:var(--t-3);font-family:var(--fm);}
.thread-card .tc-room{
  font-size:.72rem;color:var(--acc);
  background:color-mix(in srgb,var(--acc) 15%,transparent);
  padding:2px 10px;border-radius:var(--r-xs);
  display:inline-block;margin-top:6px;
}
.thread-card .tc-text{
  color:var(--t-1);font-size:.92rem;line-height:1.65;
  margin-bottom:14px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.thread-card .tc-foot{
  display:flex;gap:18px;color:var(--t-3);font-size:.78rem;
  padding-top:14px;border-top:1px solid var(--line-1);
}
.thread-card .tc-foot span{display:flex;align-items:center;gap:6px;}

.thread-detail{flex:1;display:none;flex-direction:column;background:var(--bg-0);}
.thread-detail.on{display:flex;}
.thread-detail .td-head{
  padding:14px 20px;border-bottom:1px solid var(--line-1);
  background:var(--bg-1);display:flex;align-items:center;gap:14px;flex-shrink:0;
}
.thread-detail .td-head button{
  width:42px;height:42px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--t-2);font-size:1.2rem;
  transition:all .2s var(--e);border:1px solid var(--line-1);
}
.thread-detail .td-head button:hover{background:var(--bg-3);color:var(--t-0);}
.thread-detail .td-head h2{
  font-family:var(--fd);font-size:1.05rem;font-weight:700;
  color:var(--t-0);flex:1;
}
.thread-detail .td-msgs{flex:1;overflow-y:auto;padding:20px 0;}

/* ── COMPOSER ───────────────────────────────────────────────────── */
.comp-wrap{padding:0 22px 22px;flex-shrink:0;position:relative;}
.comp{
  background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:var(--r-lg);
  transition:all .3s var(--e);position:relative;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.comp.foc{
  border-color:color-mix(in srgb,var(--acc) 60%,transparent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 12%,transparent),var(--glow);
}
.comp-top{
  display:none;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--line-1);font-size:.78rem;color:var(--t-3);
}
.comp-top.on{display:flex;}
.comp-top .rp{flex:1;min-width:0;display:flex;align-items:center;gap:10px;}
.comp-top .rp .bar{
  width:3px;height:38px;background:var(--acc);border-radius:3px;flex-shrink:0;
  box-shadow:0 0 12px var(--acc);
}
.comp-top .rp .inf{min-width:0;}
.comp-top .rp .inf b{color:var(--acc);display:block;font-size:.72rem;}
.comp-top .rp .inf span{
  display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--t-2);
}
.comp-top button{
  color:var(--t-3);padding:4px 10px;border-radius:var(--r-xs);
  transition:all .15s var(--e);
}
.comp-top button:hover{color:var(--t-0);background:var(--bg-3);}

.att-prev{
  display:none;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line-1);flex-wrap:wrap;
}
.att-prev.on{display:flex;}
.att-chip{
  position:relative;padding:10px 12px;background:var(--bg-3);
  border:1px solid var(--line-2);border-radius:var(--r-sm);
  display:flex;align-items:center;gap:10px;font-size:.8rem;max-width:240px;
}
.att-chip img{width:42px;height:42px;border-radius:var(--r-xs);object-fit:cover;}
.att-chip .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.att-chip .rm{
  position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:var(--bad);color:#fff;display:grid;place-items:center;
  font-size:.72rem;cursor:pointer;border:2px solid var(--bg-2);
}

.comp-body{display:flex;align-items:flex-end;gap:4px;padding:8px 10px;}
.cbtn{
  width:44px;height:44px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--t-3);font-size:1.2rem;
  transition:all .15s var(--e);flex-shrink:0;
}
.cbtn:hover{background:var(--bg-3);color:var(--t-0);}
.comp-body textarea{
  flex:1;background:transparent;border:none;outline:none;resize:none;
  padding:11px 8px;font-size:.98rem;line-height:1.5;color:var(--t-1);
  max-height:200px;min-height:44px;height:44px;
}
.comp-body textarea::placeholder{color:var(--t-4);}
.send{
  width:44px;height:44px;border-radius:var(--r-sm);background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:1.15rem;flex-shrink:0;
  transition:transform .2s var(--e-spring),box-shadow .3s var(--e);
  box-shadow:0 4px 16px rgba(139,92,246,.4);
}
.send:hover{transform:scale(1.06) translateY(-1px);box-shadow:var(--glow-strong);}
.send:active{transform:scale(.94);}
.send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
.cc{
  font-size:.68rem;color:var(--t-4);font-family:var(--fm);
  align-self:flex-end;padding:0 10px 12px 0;
}
.cc.warn{color:var(--warn);}
.cc.over{color:var(--bad);}

/* ── EMOJI ──────────────────────────────────────────────────────── */
.emoji{
  position:absolute;bottom:calc(100% + 10px);right:0;
  width:min(380px,calc(100vw - 40px));height:440px;
  background:var(--bg-1);border:1px solid var(--line-2);
  border-radius:var(--r-lg);box-shadow:var(--sh-xl);
  z-index:200;display:none;flex-direction:column;overflow:hidden;
}
.emoji.on{display:flex;animation:slideUp .2s var(--e-out);}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.emoji-h{padding:12px 14px;border-bottom:1px solid var(--line-1);flex-shrink:0;}
.emoji-h input{
  width:100%;background:var(--bg-0);border:1px solid var(--line-1);
  border-radius:var(--r-sm);padding:10px 14px;outline:none;font-size:.86rem;
}
.emoji-h input:focus{border-color:var(--acc);}
.emoji-cats{
  display:flex;gap:2px;padding:8px 10px;
  border-bottom:1px solid var(--line-1);overflow-x:auto;flex-shrink:0;
}
.emoji-cats::-webkit-scrollbar{height:0;}
.emoji-cats button{
  width:40px;height:40px;border-radius:var(--r-xs);font-size:1.2rem;
  flex-shrink:0;transition:all .15s var(--e);
}
.emoji-cats button:hover{background:var(--bg-3);}
.emoji-b{flex:1;overflow-y:auto;padding:10px 14px;}
.emoji-sec{margin-bottom:16px;}
.emoji-sec-t{
  font-size:.68rem;font-weight:700;color:var(--t-4);
  text-transform:uppercase;letter-spacing:.9px;padding:8px 0 6px;
}
.emoji-g{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
.emoji-g button{
  aspect-ratio:1;border-radius:var(--r-xs);font-size:1.45rem;
  display:grid;place-items:center;transition:all .15s var(--e);line-height:1;
}
.emoji-g button:hover{background:var(--bg-4);transform:scale(1.18);}

/* ── RIGHT PANEL ────────────────────────────────────────────────── */
.right{
  width:var(--right-w);flex-shrink:0;background:var(--bg-1);
  border-left:1px solid var(--line-1);
  display:flex;flex-direction:column;overflow:hidden;z-index:40;
  transition:transform .3s var(--e-out),width .3s var(--e-out);
}
.right.hide{width:0;border-left:none;transform:translateX(100%);}
.right .sec{padding:22px;border-bottom:1px solid var(--line-1);}
.right .sec h4{
  font-size:.72rem;font-weight:700;color:var(--t-3);
  text-transform:uppercase;letter-spacing:.9px;margin-bottom:16px;
}
.room-info{text-align:center;}
.room-info .big-ic{
  width:88px;height:88px;border-radius:26px;background:var(--grad);
  display:grid;place-items:center;font-size:2.4rem;margin:0 auto 16px;color:#fff;
  box-shadow:var(--glow-strong);
}
.room-info .nm{
  font-family:var(--fd);font-size:1.2rem;font-weight:700;
  color:var(--t-0);margin-bottom:6px;
}
.room-info .tp{font-size:.82rem;color:var(--t-3);line-height:1.6;margin-bottom:14px;}
.room-info .st{
  display:flex;justify-content:center;gap:20px;
  font-size:.78rem;color:var(--t-3);
}
.room-info .st b{color:var(--t-1);}
.room-acts{display:flex;gap:8px;margin-top:18px;}
.room-acts button{
  flex:1;padding:12px 6px;border-radius:var(--r-sm);background:var(--bg-2);
  border:1px solid var(--line-1);color:var(--t-3);
  font-size:.74rem;font-weight:600;
  transition:all .15s var(--e);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:60px;
}
.room-acts button:hover{
  border-color:var(--acc);color:var(--acc);background:var(--bg-3);
  box-shadow:0 0 20px color-mix(in srgb,var(--acc) 20%,transparent);
}
.room-acts button .ic{font-size:1.2rem;}

.member{
  display:flex;align-items:center;gap:12px;padding:9px 10px;
  border-radius:var(--r-sm);cursor:pointer;
  transition:background .15s var(--e);min-height:50px;
}
.member:hover{background:var(--bg-2);}
.member .av{width:38px;height:38px;font-size:1.05rem;flex-shrink:0;}
.member .inf{flex:1;min-width:0;}
.member .inf .n{
  font-size:.88rem;font-weight:600;color:var(--t-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;
}
.member .inf .n .vf{
  width:14px;height:14px;background:var(--acc-3);color:#fff;border-radius:50%;
  display:grid;place-items:center;font-size:.52rem;font-weight:700;flex-shrink:0;
}
.member .inf .st{
  font-size:.72rem;color:var(--t-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.member .role{
  font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:5px;
  letter-spacing:.4px;text-transform:uppercase;flex-shrink:0;
}
.member .role.mod{background:color-mix(in srgb,var(--acc-3) 25%,transparent);color:var(--acc-3);}
.member .role.admin{background:color-mix(in srgb,var(--acc-2) 25%,transparent);color:var(--acc-2);}
.member .role.owner{background:color-mix(in srgb,var(--acc-4) 25%,transparent);color:var(--acc-4);}

/* ── MODAL ──────────────────────────────────────────────────────── */
.ovl{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:500;display:none;align-items:center;justify-content:center;padding:20px;
}
.ovl.on{display:flex;animation:fade .2s var(--e);}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--bg-1);border:1px solid var(--line-2);border-radius:var(--r-xl);
  box-shadow:var(--sh-xl);max-width:640px;width:100%;max-height:88vh;
  overflow:hidden;display:flex;flex-direction:column;
  animation:mIn .3s var(--e-spring);
}
@keyframes mIn{from{transform:scale(.94) translateY(12px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.mh{
  padding:22px 26px;border-bottom:1px solid var(--line-1);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.mh h2{
  font-family:var(--fd);font-weight:700;font-size:1.15rem;
  color:var(--t-0);flex:1;letter-spacing:.2px;
}
.mh .x{
  width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--t-3);font-size:1.1rem;transition:all .2s var(--e);
  border:1px solid var(--line-1);
}
.mh .x:hover{background:var(--bg-3);color:var(--t-0);transform:rotate(90deg);}
.mb{padding:24px 26px;overflow-y:auto;flex:1;}
.mf{
  padding:16px 26px;border-top:1px solid var(--line-1);
  display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
}

.fr{margin-bottom:18px;}
.fr label{
  display:block;font-size:.74rem;font-weight:600;color:var(--t-2);
  margin-bottom:8px;letter-spacing:.3px;
}
.fr input,.fr select,.fr textarea{
  width:100%;background:var(--bg-0);border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:12px 16px;outline:none;font-size:.9rem;
  color:var(--t-1);transition:all .2s var(--e);
}
.fr textarea{resize:vertical;min-height:90px;}
.fr input:focus,.fr select:focus,.fr textarea:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent);
}
.hint{font-size:.7rem;color:var(--t-4);margin-top:6px;}

.btn{
  padding:11px 20px;border-radius:var(--r-sm);font-weight:600;
  font-size:.86rem;transition:all .15s var(--e);
  display:inline-flex;align-items:center;gap:8px;
  white-space:nowrap;cursor:pointer;min-height:44px;
}
.btn-pri{
  background:var(--grad);color:#fff;
  box-shadow:0 4px 20px rgba(139,92,246,.4);
}
.btn-pri:hover{transform:translateY(-1px);box-shadow:var(--glow-strong);}
.btn-gh{background:transparent;color:var(--t-2);border:1px solid var(--line-2);}
.btn-gh:hover{background:var(--bg-2);color:var(--t-0);border-color:var(--line-3);}
.btn-bad{
  background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);
  border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);
}
.btn-bad:hover{background:var(--bad);color:#fff;}

.icon-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;}
.icon-pick button{
  aspect-ratio:1;border-radius:var(--r-sm);border:1px solid var(--line-1);
  background:var(--bg-2);font-size:1.3rem;display:grid;place-items:center;
  transition:all .15s var(--e-spring);
}
.icon-pick button:hover{background:var(--bg-3);transform:scale(1.1);}
.icon-pick button.on{
  border-color:var(--acc);
  background:color-mix(in srgb,var(--acc) 22%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent);
}

.sgrp{margin-bottom:28px;}
.sgrp h3{
  font-size:.74rem;font-weight:700;color:var(--t-3);
  text-transform:uppercase;letter-spacing:.9px;
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line-1);
}
.srow{
  display:flex;align-items:center;gap:16px;padding:14px 0;
  border-bottom:1px solid var(--line-1);
}
.srow:last-child{border-bottom:none;}
.srow .inf{flex:1;min-width:0;}
.srow .inf .l{font-size:.92rem;font-weight:500;color:var(--t-1);}
.srow .inf .d{font-size:.74rem;color:var(--t-3);margin-top:3px;}
.sw{
  position:relative;width:50px;height:30px;border-radius:15px;
  background:var(--bg-4);cursor:pointer;
  transition:background .25s var(--e);flex-shrink:0;
}
.sw::after{
  content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:var(--t-3);
  transition:all .25s var(--e-spring);
}
.sw.on{background:var(--acc);box-shadow:0 0 20px color-mix(in srgb,var(--acc) 40%,transparent);}
.sw.on::after{left:23px;background:#fff;}

.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px;}
.t-swatch{
  aspect-ratio:1.4;border-radius:var(--r-md);cursor:pointer;
  border:2px solid transparent;transition:all .15s var(--e);
  position:relative;overflow:hidden;
}
.t-swatch:hover{transform:translateY(-3px);}
.t-swatch.on{
  border-color:var(--t-0);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent),var(--glow);
}
.t-swatch .nm{
  position:absolute;bottom:8px;left:10px;font-size:.68rem;font-weight:700;
  color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.95);text-transform:capitalize;
  letter-spacing:.3px;
}

.pills{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  padding:9px 18px;border-radius:var(--r-full);border:1px solid var(--line-2);
  font-size:.82rem;cursor:pointer;transition:all .15s var(--e);
  color:var(--t-2);text-transform:capitalize;min-height:40px;
  display:flex;align-items:center;
}
.pill:hover{border-color:var(--line-3);color:var(--t-1);}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 0 20px color-mix(in srgb,var(--acc) 40%,transparent);}

/* ── CMDK ───────────────────────────────────────────────────────── */
.cmdk{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  z-index:800;display:none;
  align-items:flex-start;justify-content:center;padding-top:12vh;
}
.cmdk.on{display:flex;animation:fade .15s var(--e);}
.cmdk-box{
  width:min(640px,92vw);background:var(--bg-1);
  border:1px solid var(--line-2);border-radius:var(--r-xl);
  box-shadow:var(--sh-xl);display:flex;flex-direction:column;
  max-height:72vh;overflow:hidden;animation:mIn .28s var(--e-spring);
}
.cmdk-in{
  display:flex;align-items:center;gap:12px;padding:20px 24px;
  border-bottom:1px solid var(--line-1);flex-shrink:0;
}
.cmdk-in .i{color:var(--t-3);font-size:1.1rem;}
.cmdk-in input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:1.05rem;color:var(--t-0);
}
.cmdk-in input::placeholder{color:var(--t-4);}
.cmdk-in .k{
  font-family:var(--fm);font-size:.68rem;color:var(--t-4);
  padding:5px 10px;border:1px solid var(--line-2);border-radius:6px;
}
.cmdk-list{overflow-y:auto;padding:10px;}
.cmdk-it{
  display:flex;align-items:center;gap:14px;padding:13px 16px;
  border-radius:var(--r-md);cursor:pointer;transition:background .12s var(--e);
  font-size:.92rem;min-height:50px;
}
.cmdk-it:hover,.cmdk-it.sel{background:var(--bg-3);}
.cmdk-it .ic{font-size:1.2rem;width:28px;text-align:center;flex-shrink:0;}
.cmdk-it .c{flex:1;min-width:0;}
.cmdk-it .c b{color:var(--t-0);font-weight:600;}
.cmdk-it .c .s{
  font-size:.74rem;color:var(--t-3);display:block;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cmdk-group{
  font-size:.68rem;font-weight:700;color:var(--t-4);
  text-transform:uppercase;letter-spacing:.9px;padding:14px 16px 6px;
}

/* ── CTX ────────────────────────────────────────────────────────── */
.ctx{
  position:fixed;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:8px;
  min-width:240px;z-index:900;display:none;
}
.ctx.on{display:block;animation:mIn .14s var(--e-spring);}
.ctx-it{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:var(--r-sm);cursor:pointer;font-size:.88rem;
  color:var(--t-1);transition:all .12s var(--e);min-height:44px;
}
.ctx-it:hover{background:var(--bg-4);}
.ctx-it.dng{color:var(--bad);}
.ctx-it.dng:hover{background:color-mix(in srgb,var(--bad) 18%,transparent);}
.ctx-it .ik{font-size:1.05rem;width:22px;text-align:center;flex-shrink:0;}
.ctx-sep{height:1px;background:var(--line-1);margin:6px 8px;}
.ctx-quick{
  display:flex;gap:2px;padding:6px 8px 8px;
  border-bottom:1px solid var(--line-1);margin-bottom:6px;
}
.ctx-quick button{
  width:40px;height:40px;border-radius:var(--r-xs);font-size:1.35rem;
  transition:all .15s var(--e-spring);display:grid;place-items:center;
}
.ctx-quick button:hover{background:var(--bg-4);transform:scale(1.18);}

/* ── TOASTS / LB / CONFETTI ─────────────────────────────────────── */
.toasts{
  position:fixed;bottom:20px;right:20px;z-index:999;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  pointer-events:none;
}
.toast{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:14px 18px;box-shadow:var(--sh-lg);font-size:.88rem;max-width:360px;
  backdrop-filter:blur(24px);display:flex;align-items:center;gap:12px;
  pointer-events:auto;animation:tIn .3s var(--e-spring);
}
@keyframes tIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast.out{animation:tOut .2s var(--e) forwards;}
@keyframes tOut{to{transform:translateX(120%);opacity:0;}}
.toast .i{font-size:1.4rem;flex-shrink:0;}
.toast .b{min-width:0;flex:1;}
.toast .b .t{font-weight:600;color:var(--t-0);font-size:.88rem;}
.toast .b .m{color:var(--t-3);font-size:.78rem;margin-top:2px;}
.toast .x{color:var(--t-4);padding:4px 6px;font-size:.9rem;transition:color .15s var(--e);}
.toast .x:hover{color:var(--t-0);}

.lb{
  position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:950;
  display:none;align-items:center;justify-content:center;padding:40px;
}
.lb.on{display:flex;animation:fade .2s var(--e);}
.lb img{max-width:100%;max-height:100%;border-radius:var(--r-md);box-shadow:var(--sh-xl);}
.lb .x{
  position:absolute;top:20px;right:20px;width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;font-size:1.25rem;
  display:grid;place-items:center;transition:all .2s var(--e);
}

function md(t){
  if(!t) return '';
  let h = esc(t);

      if(!st.rooms || !st.rooms.length)  st.rooms = JSON.parse(JSON.stringify(DEFAULT_ROOMS));
      if(!st.dms || !st.dms.length)      st.dms   = JSON.parse(JSON.stringify(DEFAULT_DMS));
      if(!st.messages)                   st.messages = base.messages;
      if(!st.drafts)                     st.drafts = {};
      if(!st.threads)                    st.threads = base.threads;
      if(!st.pinnedRooms)                st.pinnedRooms = ['r-g1','r-m1','r-t1'];
      if(!st.follows)                    st.follows = ['nova','pixel','rex','echo','lw'];
      if(!st.recentEmoji)                st.recentEmoji = ['❤️','🔥','😂','👍','🎉','😎'];
      return st;
    }
  }catch(e){ console.warn('load failed', e); }
  return cloneDefault();
}

    const isMe = m.authorId === 'me' || m.author === 'You';

}

function send(){
  const t = $('#input'); if(!t) return;
  const text = t.value.trim();
  if(!text && !pendingAtt.length) return;
  if(text.length > 2000){ toast('Too long','Max 2000 chars','⚠️'); return; }

  if(editingId){
    const msgs = S.messages[S.activeRoom] || [];
    const m = msgs.find(x=>x.id===editingId);
    if(m){ m.text = text; m.edited = true; m.ts = Date.now(); }
    editingId = null; clearReply();
    t.value = ''; t.style.height='44px'; onInput();
    save(); renderMessages();
    toast('Edited','','✏️');
    return;
  }

  if(text.startsWith('/')){
    const handled = handleSlash(text);
    if(handled){ t.value=''; t.style.height='44px'; onInput(); return; }
  }

  const room = roomById(S.activeRoom);
  const dm   = dmById(S.activeRoom);
  const msg = {
    id:uid(),
    authorId:'me', author:'You', icon:'🦾', color:'#8b5cf6', role:'owner',
    status:'online', text, ts:Date.now(), reactions:{},
    replyTo: curReply ? {id:curReply.id, author:curReply.author, text:curReply.text} : undefined,
    attachments: pendingAtt.length ? [...pendingAtt] : undefined,
    status:'sent', read:true
  };
  if(!S.messages[S.activeRoom]) S.messages[S.activeRoom] = [];
  S.messages[S.activeRoom].push(msg);
  delete S.drafts[S.activeRoom];
  t.value = ''; t.style.height='44px';
  pendingAtt = []; renderAttPrev(); clearReply();
  save(); renderMessages(); playSound('send');
  setTimeout(()=>{ msg.status='delivered'; save(); }, 400);
  setTimeout(()=>{ msg.status='read'; save(); renderMessages(); }, 1400);
  scheduleBot(text, room, dm);
  const sb = $('#sendBtn'); if(sb) sb.disabled = true;
  const cc = $('#cc'); if(cc) cc.textContent = '';
  onInput();
}
function scheduleBot(userText, room, dm){
  if(!room && !dm) return;
  let responder;
  if(dm) responder = userById(dm.userId);
  else {
    const ids = (room.members||[]).filter(id=>id!=='me');
    responder = userById(ids.length ? rand(ids) : 'pixel');
  }
  if(!responder) return;
  setTimeout(()=>showTyping(responder.name), 500);
  const delay = 1200 + Math.random()*1800;
  setTimeout(()=>{
    hideTyping();
    const reply = {
      id:uid(), authorId:responder.id, author:responder.name,
      icon:responder.icon, color:responder.color, role:responder.role,
      status:responder.status, text:pickBotLine(userText),
      ts:Date.now(), reactions:{}, read:true
    };
    S.messages[S.activeRoom].push(reply);
    save(); renderMessages(); playSound('recv');
  }, delay);
}
function pickBotLine(text){
  const t = (text||'').toLowerCase();
  if(/\?$/.test(text) || /^(what|how|why|when|where|who|can|is|are|do|does)/i.test(text)) return rand(BOT.question);
  if(/(hi|hey|hello|yo|sup|morning|evening)/i.test(t)) return rand(BOT.greet);
  if(/(cool|nice|awesome|amazing|great|love|fire|epic|insane|wild)/i.test(t)) return rand(BOT.hype);
  if(/(clean|respect|well done|gg)/i.test(t)) return rand(BOT.cool);
  return rand(BOT.generic);
}
function showTyping(n){
  const el = $('#typing'), tx = $('#typingTxt');
  if(el) el.classList.add('on');
  if(tx) tx.textContent = `${n} is typing…`;
}
function hideTyping(){ $('#typing')?.classList.remove('on'); }

function handleSlash(text){
  const parts = text.slice(1).split(/\s+/);
  const cmd = (parts[0]||'').toLowerCase();
  const rest = parts.slice(1).join(' ');

  const pushBot = (msgText, type)=>{
    const msg = {id:uid(), author:'Nexus Bot', authorIcon:'🤖', icon:'🤖', color:'#06b6d4', role:'bot', status:'online', text:msgText, ts:Date.now(), reactions:{}, type:type||'text', read:true};
    if(!S.messages[S.activeRoom]) S.messages[S.activeRoom] = [];
    S.messages[S.activeRoom].push(msg);
    save(); renderMessages();
    return true;
  };

  switch(cmd){
    case 'shrug':     return pushBot((text.replace('/shrug','').trim() + ' ¯\\_(ツ)_/¯').trim());
    case 'tableflip': return pushBot('(╯°□°）╯︵ ┻━┻');
    case 'unflip':    return pushBot('┬─┬ノ( º _ ºノ)');
    case 'me':        return pushBot(rest, 'action');
    case 'poll': {
      const pts = rest.split('|').map(s=>s.trim()).filter(Boolean);
      if(pts.length < 3){ toast('Poll','Use: /poll Q | o1 | o2','⚠️'); return true; }
      const [q, ...opts] = pts;
      const poll = {question:q, options:opts.map(o=>({text:o, votes:[]})), multiple:false};
      const m = {id:uid(), authorId:'me', author:'You', icon:'🦾', color:'#8b5cf6', role:'owner', status:'online', text:'', ts:Date.now(), reactions:{}, poll, read:true};
      S.messages[S.activeRoom].push(m);
      save(); renderMessages();
      return true;
    }
    case 'roll': {
      const m = rest.match(/^(\d+)?d(\d+)$/);
      const n = clamp(parseInt(m?m[1]:1)||1, 1, 20);
      const d = clamp(parseInt(m?m[2]:6)||6, 2, 1000);
      const rolls = Array.from({length:n}, ()=>Math.floor(Math.random()*d)+1);
      const total = rolls.reduce((a,b)=>a+b,0);
      return pushBot(`🎲 Rolled ${n}d${d}: **${rolls.join(' + ')}** = **${total}**`);
    }
    case 'coinflip': return pushBot(`🪙 **${Math.random()<0.5?'HEADS':'TAILS'}**`);
    case '8ball': {
      const ans = ['It is certain.','Without a doubt.','Yes definitely.','Most likely.','Reply hazy.','Ask again later.','Don\'t count on it.','My reply is no.'];
      return pushBot(`🎱 ${rand(ans)}`);
    }
    case 'spoiler': return pushBot(`||${rest}||`);
    case 'code':    return pushBot('```\n'+(rest||'// your code here')+'\n```');
    case 'gif':     return pushBot(rand(STICKERS));
    case 'pick': {
      const opts = rest.split(',').map(s=>s.trim()).filter(Boolean);
      if(opts.length<2) return pushBot('Give me 2+ options separated by commas.');
      return pushBot(`🎯 I pick: **${rand(opts)}**`);
    }
    case 'math': {
      try { const r = Function('"use strict";return ('+(rest||'0')+')')(); return pushBot(`🧮 \`${rest}\` = **${r}**`); }
      catch(e){ return pushBot('🤔 That math doesn\'t parse.'); }
    }
    case 'weather': {
      const city = rest || 'Neo Tokyo';
      const t = Math.floor(Math.random()*30)+5;
      const w = rand(['clear skies','light rain','heavy fog','neon haze','acid drizzle','solar flare']);
      return pushBot(`🌤️ **${city}** — ${t}°C, ${w}`);
    }
    case 'trivia': {
      const qs = [
        ['First graphical web browser year?','1993'],
        ['HTTP stands for?','HyperText Transfer Protocol'],
        ['Linux kernel creator?','Linus Torvalds'],
        ['Largest prime under 100?','97'],
      ];
      const [q,a] = rand(qs);
      return pushBot(`🧠 **Trivia:** ${q}\n||Answer: ${a}||`);
    }
    case 'remind': {
      const m = rest.match(/^(\d+)(s|m|h)\s+(.*)$/);
      if(!m){ toast('Remind','Use: /remind 10m text','⚠️'); return true; }
      const ms = parseInt(m[1]) * (m[2]==='s'?1000:m[2]==='m'?60000:3600000);
      setTimeout(()=>toast('⏰ Reminder', m[3], '⏰', 6000), ms);
      return pushBot(`⏰ Reminder set for ${m[1]}${m[2]}: "${m[3]}"`);
    }
    case 'timer': {
      const secs = clamp(parseInt(rest)||30, 1, 3600);
      setTimeout(()=>{ toast('⏱️ Time!', `${secs}s elapsed`, '⏰', 6000); playSound('notify'); }, secs*1000);
      return pushBot(`⏱️ Timer started: ${secs}s`);
    }
    case 'clear': {
      if(!confirm('Clear all messages in this channel?')) return true;
      S.messages[S.activeRoom] = [];
      save(); renderMessages();
      return true;
    }
    default: return false;
  }
}

function replyTo(id){
  const msgs = S.messages[S.activeRoom] || [];
  const m = msgs.find(x=>x.id===id);
  if(!m) return;
  curReply = {id:m.id, author:m.author, text:m.text};
  const rp = $('#rpNm'), rt = $('#rpTx');
  if(rp) rp.textContent = `Replying to ${m.author}`;
  if(rt) rt.textContent = stripMd(m.text||'').slice(0,100);

  curReply = null; editingId = null;
  $('#compTop')?.classList.remove('on');

function react(msgId, emoji){
  const msgs = S.messages[S.activeRoom] || [];
  const m = msgs.find(x=>x.id===msgId);
  if(!m) return;
  m.reactions = m.reactions || {};
  const list = m.reactions[emoji] || [];
  const i = list.indexOf('me');
  if(i>=0) list.splice(i,1);
  else list.push('me');
  if(!list.length) delete m.reactions[emoji];
  else m.reactions[emoji] = list;
  save(); renderMessages();
  if(i<0) playSound('react');
  S.recentEmoji = [emoji, ...(S.recentEmoji||[]).filter(e=>e!==emoji)].slice(0,12);
  save();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 9 · COMPOSER
   ═══════════════════════════════════════════════════════════════════ */
function onFocus(){ $('#comp')?.classList.add('foc'); }
function onBlur(){ $('#comp')?.classList.remove('foc'); }
function onInput(){
  const t = $('#input'); if(!t) return;
  t.style.height = '44px';
  t.style.height = Math.min(t.scrollHeight, 200)+'px';
  const len = t.value.length;
  const cc = $('#cc');
  if(cc){
    cc.textContent = len > 0 ? len : '';
    cc.classList.toggle('warn', len > 1600);
    cc.classList.toggle('over', len > 2000);
  }
  const sb = $('#sendBtn');
  if(sb) sb.disabled = !t.value.trim() && !pendingAtt.length;
  if(S.activeRoom) S.drafts[S.activeRoom] = t.value;
}
function onKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}
function handleFiles(files){
  if(!files?.length) return;
  Array.from(files).forEach(f=>{
    if(f.size > 8*1024*1024){ toast('Too large',`${f.name} over 8MB`,'⚠️'); return; }
    const att = {name:f.name, size:f.size, type:'file'};
    if(f.type.startsWith('image/')){
      att.type = 'image';
      const r = new FileReader();
      r.onload = ev=>{ att.url = ev.target.result; pendingAtt.push(att); renderAttPrev(); };
      r.readAsDataURL(f);
    } else {
      pendingAtt.push(att);
      renderAttPrev();
    }
  });
  const sb = $('#sendBtn'); if(sb) sb.disabled = false;
}
function renderAttPrev(){
  const el = $('#attPrev'); if(!el) return;
  if(!pendingAtt.length){ el.classList.remove('on'); el.innerHTML=''; return; }
  el.classList.add('on');
  el.innerHTML = pendingAtt.map((a,i)=>`

function renderThreadsList(){

        </div>
      </div>`;

function findMessage(id){

function openCmdk(){
  const el = $('#cmdk'); if(!el) return;
  el.classList.add('on');
  const inp = $('#cmdkIn');
  if(inp){ inp.value=''; inp.focus(); }
  renderCmdk();
}
function closeCmdk(){ $('#cmdk')?.classList.remove('on'); }
function renderCmdk(){
  const q = ($('#cmdkIn')?.value||'').trim().toLowerCase();
  const list = $('#cmdkList'); if(!list) return;
  const groups = [];

  const cmds = [
    {ic:'＋', t:'Create new room',   s:'Start a new chat room',   fn:()=>{closeCmdk();openNewRoom();}},
    {ic:'🎉', t:'Toggle party mode', s:'Neon borders fade',       fn:()=>{closeCmdk();toggleParty();}},
    {ic:'⚙️', t:'Open settings',     s:'Themes, sounds, prefs',   fn:()=>{closeCmdk();openSettings();}},
    {ic:'🏠', t:'Home feed',         s:'See what everyone posts', fn:()=>{closeCmdk();setView('feed');}},
    {ic:'🧵', t:'Threads',           s:'Deep-dive conversations', fn:()=>{closeCmdk();setView('threads');}},
    {ic:'💬', t:'Direct messages',   s:'Private conversations',   fn:()=>{closeCmdk();setView('dms');}},
    {ic:'📌', t:'Pinned messages',   s:'All pins',                fn:()=>{closeCmdk();openPinned();}},
    {ic:'⭐', t:'Starred messages',  s:'Your saves',              fn:()=>{closeCmdk();openStarred();}},
    {ic:'📊', t:'Stats',             s:'Chat analytics',          fn:()=>{closeCmdk();openStats();}},
    {ic:'⌨️', t:'Keyboard shortcuts',s:'All shortcuts',           fn:()=>{closeCmdk();openShortcuts();}},
    {ic:'💾', t:'Export data',       s:'Download JSON',           fn:()=>{closeCmdk();exportData();}},
  ].filter(c=>!q || c.t.toLowerCase().includes(q) || c.s.toLowerCase().includes(q));
  if(cmds.length) groups.push({group:'Commands', items:cmds});

  const rooms = S.rooms.filter(r=>!q || r.name.toLowerCase().includes(q)).slice(0,6);
  if(rooms.length){
    groups.push({group:'Rooms', items: rooms.map(r=>({
      ic: r.icon||'#', t: '#'+r.name, s: r.topic||'',
      fn:()=>{closeCmdk(); openRoom(r.id);}
    }))});
  }
  const users = USERS.filter(u=>u.id!=='me' && (!q || u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q))).slice(0,6);
  if(users.length){
    groups.push({group:'People', items: users.map(u=>({
      ic: u.icon, t: u.name + (u.verified?' ✓':''),
      s: u.handle + ' · ' + (u.followers||0).toLocaleString() + ' followers',
      fn:()=>{closeCmdk(); openUser(u.id);}
    }))});
  }

  cmdkResults = groups.flatMap(g=>g.items);
  cmdkIdx = 0;
  if(!cmdkResults.length){
    list.innerHTML = `<div class="empty" style="padding:40px">No results for "${esc(q)}"</div>`;
    return;
  }
  let html = '', idx = 0;
  groups.forEach(g=>{
    html += `<div class="cmdk-group">${esc(g.group)}</div>`;
    g.items.forEach(it=>{
      const i = idx++;
      html += `
        <div class="cmdk-it ${i===0?'sel':''}" onclick="runCmdk(${i})" data-idx="${i}">
          <span class="ic">${it.ic}</span>
          <div class="c"><b>${esc(it.t)}</b>${it.s?`<span class="s">${esc(it.s)}</span>`:''}</div>
        </div>`;
    });
  });
  list.innerHTML = html;
}
function cmdkKey(e){
  if(!cmdkResults.length) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdkIdx = (cmdkIdx+1)%cmdkResults.length; selCmdk(); }
  if(e.key==='ArrowUp'){   e.preventDefault(); cmdkIdx = (cmdkIdx-1+cmdkResults.length)%cmdkResults.length; selCmdk(); }
  if(e.key==='Enter'){     e.preventDefault(); runCmdk(cmdkIdx); }
}
function selCmdk(){
  $$('.cmdk-it').forEach((el,i)=>el.classList.toggle('sel', i===cmdkIdx));
  $('.cmdk-it.sel')?.scrollIntoView({block:'nearest'});
}
function runCmdk(i){
  const it = cmdkResults[i];
  if(!it) return;
  closeCmdk();
  try{ it.fn(); }catch(e){ console.warn(e); }
}

  r.readAsText(f);

/* ═══════════════════════════════════════════════════════════════════
   SECTION 16 · EFFECTS
   ═══════════════════════════════════════════════════════════════════ */
let ac;
function playSound(type){
  if(!S.sounds || S.muted) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    const n = ac.currentTime;
    if(type==='send'){ o.frequency.setValueAtTime(660, n); o.frequency.exponentialRampToValueAtTime(880, n+0.08); }
    else if(type==='recv'){ o.frequency.setValueAtTime(440, n); o.frequency.exponentialRampToValueAtTime(330, n+0.1); }
    else if(type==='react'){ o.frequency.setValueAtTime(880, n); o.frequency.exponentialRampToValueAtTime(1200, n+0.06); }
    else { o.frequency.setValueAtTime(523, n); o.frequency.setValueAtTime(659, n+0.1); o.frequency.setValueAtTime(784, n+0.2); }
    g.gain.setValueAtTime(0.05, n);
    g.gain.exponentialRampToValueAtTime(0.001, n+0.3);
    o.type = 'sine';
    o.start(n); o.stop(n+0.3);
  }catch(e){}
}
function toggleParty(){
  S.party = !S.party; save();
  document.body.classList.toggle('party', S.party);
  const b = $('#partyBtn');
  if(b){
    b.classList.toggle('on', S.party);
    b.textContent = S.party ? '🎉 Dancing' : '🎉 Party';
  }
  if(S.party){ toast('🎉 Party ON','Neon borders fading in…','🎉'); confetti(60); }
  else        toast('Party off','Neon fading out…','💼');
}
function toggleMute(){
  S.muted = !S.muted; save();
  toast(S.muted?'Muted':'Unmuted','',S.muted?'🔇':'🔔');
}
function confetti(n=80){
  const c = $('#confetti'); if(!c) return;
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const pieces = Array.from({length:n}, ()=>({
    x: Math.random()*c.width, y: -20-Math.random()*c.height*0.3,
    vx: (Math.random()-0.5)*4, vy: 2+Math.random()*4,
    size: 4+Math.random()*6, rot: Math.random()*Math.PI,
    vr: (Math.random()-0.5)*0.3,
    color: rand(['#8b5cf6','#ec4899','#06b6d4','#10b981','#f59e0b','#ef4444','#facc15'])
  }));
  let f = 0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(++f < 150) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}
function toast(title, msg, icon='✨', dur=3500){
  const c = $('#toasts'); if(!c) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    <span class="i">${icon}</span>
    <div class="b"><div class="t">${esc(title)}</div>${msg?`<div class="m">${esc(msg)}</div>`:''}</div>
    <button class="x" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 220); }, dur);
}

function closePinnedBar(){ $('#pinnedBar')?.classList.remove('on'); }
function jumpToPin(){

/* ═══════════════════════════════════════════════════════════════════
   SECTION 17 · GLOBAL EVENTS
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='f'){ e.preventDefault(); openCmdk(); return; }
  if((e.metaKey||e.ctrlKey) && e.key==='/'){ e.preventDefault(); openShortcuts(); return; }
  if((e.metaKey||e.ctrlKey) && e.shiftKey && e.key.toLowerCase()==='p'){ e.preventDefault(); toggleParty(); return; }
  if(e.key==='Escape'){
    if($('#cmdk')?.classList.contains('on')){ closeCmdk(); return; }
    if($('#ovl')?.classList.contains('on')){ closeModal(); return; }
    if($('#emoji')?.classList.contains('on')){ $('#emoji').classList.remove('on'); return; }
    if($('#threadDetail')?.classList.contains('on')){ closeThreadDetail(); return; }
    closeCtx(); clearReply();
  }
});

document.addEventListener('click', e=>{
  const ep = $('#emoji');
  if(ep && !e.target.closest('#emoji') && !e.target.closest('#emojiBtn')) ep.classList.remove('on');
  if(!e.target.closest('#ctx')) closeCtx();
  if(!isMobile()) return;
  const side = $('#side');
  if(side?.classList.contains('open') && !side.contains(e.target) && !e.target.closest('.back')) {
    side.classList.remove('open');
  }
});

const ovlEl = $('#ovl');
if(ovlEl) ovlEl.addEventListener('click', e=>{ if(e.target.id==='ovl') closeModal(); });
const lbEl = $('#lb');
if(lbEl) lbEl.addEventListener('click', e=>{ if(e.target.id==='lb') closeLb(); });

const msgsEl = $('#msgs');
if(msgsEl){
  msgsEl.addEventListener('scroll', ()=>{
    const atB = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 100;
    $('#scrollBtm')?.classList.toggle('on', !atB);
  });
  msgsEl.addEventListener('dragover', e=>{ e.preventDefault(); });
  msgsEl.addEventListener('drop', e=>{
    e.preventDefault();
    if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 18 · INIT
   ═══════════════════════════════════════════════════════════════════ */
function init(){
  try{
    applyTheme();
    if(S.party){
      const b = $('#partyBtn');
      if(b){ b.classList.add('on'); b.textContent = '🎉 Dancing'; }
    }
    renderRail();
    renderList();
    setView(S.view || 'chat');

    /* ambient presence */
    setInterval(()=>{
      const pool = USERS.filter(u=>u.id!=='me');
      const u = rand(pool);
      if(u && !u.isLive) u.status = rand(['online','away','busy','offline']);
      if(S.rightOpen) renderRight();
    }, 20000);

    /* ambient messages */
    setInterval(()=>{
      if(Math.random() < 0.22){
        const rooms = S.rooms.filter(r=>r.id !== S.activeRoom);
        if(!rooms.length) return;
        const r = rand(rooms);
        const u = userById(rand((r.members||[]).filter(id=>id!=='me')));
        if(!u) return;
        if(!S.messages[r.id]) S.messages[r.id] = [];
        S.messages[r.id].push({
          id:uid(), authorId:u.id, author:u.name, icon:u.icon, color:u.color,
          role:u.role, status:u.status,
          text: rand(['just got back','anyone around?','working on something cool','check this out 👀','this is wild','lmao','thoughts?','big news coming']),
          ts: Date.now(), reactions:{}, read:false
        });
        save(); renderList(); renderRail();
        if(S.activeRoom === r.id) renderMessages();
      }
    }, 25000);

    setTimeout(()=>toast('Welcome to Nexus','⌘K to search · ⌘/ for shortcuts','✦',5000), 900);
  }catch(e){
    console.error('Init failed:', e);
    toast('Init error', e.message, '⚠️', 8000);
  }
}

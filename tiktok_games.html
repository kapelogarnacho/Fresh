<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00FFFF">
    <title>G-ARCADE · Fresh Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #040407;
            --primary: #ff0050;
            --secondary: #00f2fe;
            --accent: #ffff00;
            --card: rgba(18, 18, 28, .8);
            --border: rgba(255, 255, 255, .1);
            --glow: 0 0 20px rgba(0,242,254,.4);
        }
        body[data-theme="cyber"] {
            --bg: #03000f;
            --primary: #00f2fe;
            --secondary: #ff007f;
            --accent: #fffb00;
        }
        body[data-theme="sakura"] {
            --bg: #1a0f14;
            --primary: #fda4af;
            --secondary: #f43f5e;
            --accent: #fbbf24;
        }
        body[data-theme="emerald"] {
            --bg: #020a04;
            --primary: #10b981;
            --secondary: #047857;
            --accent: #34d399;
        }
        body {
            background: var(--bg);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            height: 56px;
            background: rgba(10, 10, 15, .9);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            font-size: 24px;
        }
        .search {
            width: 200px;
            border-radius: 30px;
            padding: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--primary));
            background-size: 300% 300%;
            animation: borderFlow 6s infinite;
        }
        @keyframes borderFlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .search input {
            width: 100%;
            height: 28px;
            border: none;
            outline: none;
            background: #0b0b11;
            color: #fff;
            border-radius: 30px;
            padding: 0 14px;
            font-size: .75rem;
            text-align: center;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .party-btn {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: .7rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, .5);
            transition: all .2s;
        }
        .party-btn:active {
            transform: scale(.95);
        }
        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--secondary);
            background: radial-gradient(circle, var(--primary), var(--secondary));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: transform .3s;
        }
        .theme-btn:hover {
            transform: rotate(20deg) scale(1.1);
        }
        .profile {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            cursor: pointer;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .profile-info {
            line-height: 1.1;
        }
        .profile-name {
            font-size: .6rem;
            font-weight: 800;
        }
        .profile-xp {
            font-size: .5rem;
            color: var(--secondary);
        }

        /* Main container */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 50px;
            background: rgba(8, 8, 12, .95);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 0;
            align-items: center;
            flex-shrink: 0;
        }
        .side-item {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }
        .side-item.active {
            background: rgba(0, 242, 254, .1);
            color: var(--secondary);
            box-shadow: inset 0 0 0 1px var(--secondary);
        }
        .side-item:hover {
            background: rgba(255, 255, 255, .03);
            color: #fff;
        }

        /* Feed viewport */
        .viewport {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 12px;
            scroll-snap-type: y mandatory;
            background: var(--bg);
        }
        .viewport.active {
            display: block;
        }

        /* Dashboard (grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            padding: 12px;
        }
        .game-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            transition: all .3s;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .game-card:hover {
            border-color: var(--secondary);
            box-shadow: var(--glow);
            transform: translateY(-4px);
        }
        .game-card .emoji {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .game-card .title {
            font-weight: 800;
            font-size: .8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-card .meta {
            font-size: .6rem;
            color: #888;
        }
        .game-card .vote {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .6);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: .6rem;
            border: 1px solid var(--primary);
            color: var(--primary);
            cursor: pointer;
        }

        /* Theme overlay */
        .theme-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }
        .theme-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .theme-panel {
            background: #101018;
            border: 2px solid var(--secondary);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 50px var(--secondary);
        }
        .theme-panel h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .theme-panel .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .theme-option {
            border-radius: 16px;
            padding: 16px 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all .3s;
            font-weight: 800;
            font-size: .8rem;
        }
        .theme-option:hover {
            transform: scale(1.05);
            border-color: #fff;
        }
        .theme-option.midnight {
            background: #1a1a2e;
            color: #ddd;
            border-color: #5c00ff;
        }
        .theme-option.cyber {
            background: #0b0b13;
            color: #00f2fe;
            border-color: #ff007f;
        }
        .theme-option.sakura {
            background: #2d1b1e;
            color: #fda4af;
            border-color: #f43f5e;
        }
        .theme-option.emerald {
            background: #052e16;
            color: #10b981;
            border-color: #047857;
        }
        .close-theme {
            margin-top: 20px;
            background: var(--secondary);
            border: none;
            color: #000;
            padding: 8px 30px;
            border-radius: 30px;
            font-weight: 900;
            cursor: pointer;
            font-size: .8rem;
        }

        /* Cabinet feed (fullscreen games) */
        .cabinet {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 300;
            background: #000;
            display: none;
            flex-direction: column;
        }
        .cabinet.active {
            display: flex;
        }
        .cabinet-header {
            height: 48px;
            background: rgba(0, 0, 0, .9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }
        .cabinet-header .title {
            font-weight: 800;
            color: var(--secondary);
            text-transform: uppercase;
        }
        .cabinet-header .exit {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 5px 16px;
            border-radius: 20px;
            font-weight: 900;
            cursor: pointer;
            font-size: .7rem;
        }
        .feed {
            flex: 1;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
        }
        .slide {
            width: 100%;
            height: calc(100vh - 48px);
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid var(--border);
            background: radial-gradient(circle, #0a0a15, #030308);
        }
        .slide-game {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, .95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .slide-cover .play-btn {
            background: var(--secondary);
            border: none;
            color: #000;
            padding: 12px 40px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 20px var(--secondary);
        }
        .game-over {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, #000);
            display: none;
            text-align: center;
            z-index: 20;
        }
        .slide.dead .game-over {
            display: block;
        }
        .game-over .score {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent);
        }
        .game-over .btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .game-over .btn {
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            font-size: .7rem;
        }
        .btn-restart {
            background: var(--secondary);
            color: #000;
        }
        .btn-exit {
            background: var(--primary);
            color: #fff;
        }

        /* side strip for TikTok-like controls */
        .side-strip {
            width: 60px;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            z-index: 25;
        }
        .strip-btn {
            background: rgba(0, 0, 0, .5);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all .2s;
        }
        .strip-btn.active {
            color: var(--primary);
            background: rgba(255, 0, 80, .2);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .85);
            border: 1px solid var(--secondary);
            color: #fff;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: .75rem;
            z-index: 9999;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        /* Phaser container */
        #phaser-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #phaser-container canvas {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body data-theme="midnight">

    <header>
        <div class="logo"><span>🎮</span>G-ARCADE</div>
        <div class="search"><input type="text" id="search-input" placeholder="🔍 Search games..."></div>
        <div class="actions">
            <button class="party-btn" onclick="toggleParty()">⚡ PARTY</button>
            <button class="theme-btn" onclick="openTheme()">🎨</button>
            <div class="profile" onclick="toggleProfile()">
                <div class="avatar" id="avatar">👾</div>
                <div class="profile-info"><div class="profile-name" id="profile-name">Aura</div><div class="profile-xp" id="profile-xp">Lvl 1 · 0 XP</div></div>
            </div>
        </div>
    </header>

    <div class="main">
        <div class="sidebar">
            <button class="side-item active" onclick="showDashboard()">🏠</button>
            <button class="side-item" onclick="showFeed()">📱</button>
            <button class="side-item" onclick="openTheme()">🎨</button>
        </div>
        <div class="viewport active" id="dashboard-view">
            <!-- Dashboard grid will be rendered here -->
        </div>
        <div class="viewport" id="feed-view">
            <!-- Feed games will be rendered here -->
        </div>
    </div>

    <!-- Theme Overlay -->
    <div class="theme-overlay" id="theme-overlay">
        <div class="theme-panel">
            <h2>🎨 Select Theme</h2>
            <div class="theme-grid">
                <div class="theme-option midnight" onclick="setTheme('midnight')">Midnight</div>
                <div class="theme-option cyber" onclick="setTheme('cyber')">Cyberpunk</div>
                <div class="theme-option sakura" onclick="setTheme('sakura')">Sakura</div>
                <div class="theme-option emerald" onclick="setTheme('emerald')">Emerald</div>
            </div>
            <button class="close-theme" onclick="closeTheme()">Close</button>
        </div>
    </div>

    <!-- Cabinet Feed -->
    <div class="cabinet" id="cabinet">
        <div class="cabinet-header">
            <span class="title" id="cabinet-title">G-ARCADE FEED</span>
            <button class="exit" onclick="exitCabinet()">✕ Exit</button>
        </div>
        <div class="feed" id="feed"></div>
        <div class="side-strip" id="side-strip"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== USER & STORAGE ==========
        let user = { name: "Aura", avatar: "👾", level: 1, xp: 0, coins: 100 };
        let votedGames = JSON.parse(localStorage.getItem('voted') || '[]');

        function saveUser() { localStorage.setItem('user', JSON.stringify(user)); }
        function loadUser() { const u = JSON.parse(localStorage.getItem('user')); if (u) user = { ...user, ...u }; }

        // ========== GAME DATA ==========
        // Each game has an id, title, emoji, category, and a loader function
        const gameDefinitions = [
            { id: 'baby-commando', title: 'Baby Commando 2', emoji: '🔫', cat: 'shooter', desc: 'Twin-stick shooter survival', isPhaser: true },
            { id: 'tap-rhythm', title: 'Tap-Rhythm', emoji: '🎯', cat: 'rhythm', desc: 'Tap the orb faster & faster' },
            { id: 'reaction', title: 'Reaction Dial', emoji: '⚡', cat: 'reflex', desc: 'Tap when dial aligns' },
            { id: 'memory', title: 'Cyber Memory', emoji: '🧩', cat: 'puzzle', desc: 'Match all pairs quickly' },
            { id: 'evader', title: 'Void Evader', emoji: '🚀', cat: 'action', desc: 'Dodge meteors & shoot' },
            { id: 'piano', title: 'Piano Tiles', emoji: '🎹', cat: 'rhythm', desc: 'Tap the rhythm tiles' },
            { id: 'math', title: 'Math Sprint', emoji: '🧮', cat: 'puzzle', desc: 'Answer math fast' },
            { id: 'rocket-dodge', title: 'Rocket Dodge', emoji: '🛸', cat: 'action', desc: 'Dodge incoming rockets' },
            { id: 'color-switch', title: 'Color Switch', emoji: '🔄', cat: 'reflex', desc: 'Tap to change color' }
        ];

        // ========== THEME ==========
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            closeTheme();
            showToast(`Theme: ${theme}`);
        }

        function openTheme() {
            document.getElementById('theme-overlay').classList.add('show');
        }

        function closeTheme() {
            document.getElementById('theme-overlay').classList.remove('show');
        }

        // ========== TOAST ==========
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ========== DASHBOARD ==========
        function renderDashboard() {
            const grid = document.getElementById('dashboard-view');
            grid.innerHTML = '';
            const list = [...gameDefinitions];
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="emoji">${game.emoji}</div>
                    <div class="title">${game.title}</div>
                    <div class="meta">${game.desc}</div>
                    <div class="vote" onclick="toggleVote('${game.id}')">❤️ ${votedGames.includes(game.id) ? 'Liked' : 'Vote'}</div>
                `;
                card.onclick = () => launchCabinet(game.id);
                grid.appendChild(card);
            });
        }

        function toggleVote(id) {
            if (votedGames.includes(id)) votedGames = votedGames.filter(v => v !== id);
            else votedGames.push(id);
            localStorage.setItem('voted', JSON.stringify(votedGames));
            renderDashboard();
        }

        // ========== FEED (TikTok style) ==========
        function showFeed() {
            document.getElementById('dashboard-view').classList.remove('active');
            document.getElementById('feed-view').classList.add('active');
            renderFeed();
        }

        function showDashboard() {
            document.getElementById('feed-view').classList.remove('active');
            document.getElementById('dashboard-view').classList.add('active');
            renderDashboard();
        }

        function renderFeed() {
            const feed = document.getElementById('feed-view');
            feed.innerHTML = '';
            gameDefinitions.forEach(game => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `feed-${game.id}`;
                slide.dataset.gameId = game.id;
                slide.innerHTML = `
                    <div class="slide-game" id="slide-game-${game.id}"></div>
                    <div class="slide-cover" id="cover-${game.id}">
                        <div style="font-size:3rem">${game.emoji}</div>
                        <h3>${game.title}</h3>
                        <p style="color:#888;font-size:.8rem">${game.desc}</p>
                        <button class="play-btn" onclick="startGameInSlide('${game.id}')">▶ PLAY</button>
                    </div>
                    <div class="game-over" id="over-${game.id}">
                        <div class="score" id="score-${game.id}">Score: 0</div>
                        <div class="btns">
                            <button class="btn btn-restart" onclick="restartGame('${game.id}')">Restart</button>
                            <button class="btn btn-exit" onclick="exitCabinet()">Exit</button>
                        </div>
                    </div>
                `;
                feed.appendChild(slide);
            });
            // Intersection observer to activate games
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.dataset.gameId;
                        // Start game if it's a Phaser game and not started yet
                        if (id === 'baby-commando' && !entry.target.querySelector('canvas')) {
                            initPhaserBabyCommando(entry.target);
                        }
                        // For non-phaser games, no auto start
                    }
                });
            }, { threshold: 0.6 });
            feed.querySelectorAll('.slide').forEach(slide => observer.observe(slide));
        }

        // ========== CABINET (fullscreen) ==========
        function launchCabinet(gameId) {
            const cabinet = document.getElementById('cabinet');
            cabinet.classList.add('active');
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            // Build slides for all games
            gameDefinitions.forEach(game => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `slide-${game.id}`;
                slide.dataset.gameId = game.id;
                slide.innerHTML = `
                    <div class="slide-game" id="slide-game-${game.id}"></div>
                    <div class="slide-cover" id="cover-${game.id}">
                        <div style="font-size:3rem">${game.emoji}</div>
                        <h3>${game.title}</h3>
                        <p style="color:#888;font-size:.8rem">${game.desc}</p>
                        <button class="play-btn" onclick="startGameInSlide('${game.id}')">▶ PLAY</button>
                    </div>
                    <div class="game-over" id="over-${game.id}">
                        <div class="score" id="score-${game.id}">Score: 0</div>
                        <div class="btns">
                            <button class="btn btn-restart" onclick="restartGame('${game.id}')">Restart</button>
                            <button class="btn btn-exit" onclick="exitCabinet()">Exit</button>
                        </div>
                    </div>
                `;
                feed.appendChild(slide);
            });
            // Scroll to the selected game
            setTimeout(() => {
                const target = document.getElementById(`slide-${gameId}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
            // Phaser observer
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.target.dataset.gameId === 'baby-commando' && !entry.target.querySelector('canvas')) {
                        initPhaserBabyCommando(entry.target);
                    }
                });
            }, { threshold: 0.7 });
            feed.querySelectorAll('.slide').forEach(slide => observer.observe(slide));
        }

        function exitCabinet() {
            // Destroy Phaser game if active
            if (window.babyCommandoGame) {
                window.babyCommandoGame.destroy(true);
                window.babyCommandoGame = null;
            }
            document.getElementById('cabinet').classList.remove('active');
            showDashboard();
        }

        // ========== GAME START ==========
        function startGameInSlide(gameId) {
            const slide = document.getElementById(`slide-${gameId}`);
            const cover = slide.querySelector(`#cover-${gameId}`);
            cover.style.display = 'none';
            const gameContainer = slide.querySelector(`#slide-game-${gameId}`);
            gameContainer.innerHTML = '';

            if (gameId === 'baby-commando') {
                // Phaser will be initialized by observer, but also start if called directly
                if (!gameContainer.querySelector('canvas')) {
                    initPhaserBabyCommando(slide);
                }
            } else if (gameId === 'tap-rhythm') {
                startTapRhythm(gameContainer, slide);
            } else if (gameId === 'reaction') {
                startReaction(gameContainer, slide);
            } else if (gameId === 'memory') {
                startMemory(gameContainer, slide);
            } else if (gameId === 'evader') {
                startEvader(gameContainer, slide);
            } else if (gameId === 'piano') {
                startPiano(gameContainer, slide);
            } else if (gameId === 'math') {
                startMath(gameContainer, slide);
            } else if (gameId === 'rocket-dodge') {
                startRocketDodge(gameContainer, slide);
            } else if (gameId === 'color-switch') {
                startColorSwitch(gameContainer, slide);
            }
        }

        function restartGame(gameId) {
            const slide = document.getElementById(`slide-${gameId}`);
            slide.classList.remove('dead');
            const cover = slide.querySelector(`#cover-${gameId}`);
            cover.style.display = 'flex';
            const gameContainer = slide.querySelector(`#slide-game-${gameId}`);
            gameContainer.innerHTML = '';
            // For phaser, need to destroy old game
            if (gameId === 'baby-commando' && window.babyCommandoGame) {
                window.babyCommandoGame.destroy(true);
                window.babyCommandoGame = null;
            }
            startGameInSlide(gameId);
        }

            const slide = document.getElementById(`slide-${gameId}`);
            slide.classList.add('dead');
            const s = slide.querySelector(`#score-${gameId}`);

        // ========== PHASER BABY COMMANDO ==========
        function initPhaserBabyCommando(slide) {
            const container = slide.querySelector(`#slide-game-baby-commando`);
            container.innerHTML = '<div id="phaser-container"></div>';

            // Destroy previous instance
            if (window.babyCommandoGame) {
                window.babyCommandoGame.destroy(true);
                window.babyCommandoGame = null;
            }

            const config = {
                type: Phaser.AUTO,
                parent: 'phaser-container',
                width: 800,
                height: 600,
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH
                },
                physics: {
                    default: 'arcade',
                    arcade: { gravity: { x: 0, y: 0 }, debug: false }
                },
                scene: {
                    create: function() {
                        // Simplified Baby Commando for feed
                        let player = this.add.circle(400, 300, 12, 0xff4444);
                        this.physics.add.existing(player);
                        player.body.setCollideWorldBounds(true);

                        // create some enemies
                        this.enemies = [];
                        for (let i = 0; i < 5; i++) {
                            let e = this.add.circle(Math.random() * 700 + 50, Math.random() * 500 + 50, 10, 0x00ff88);
                            this.physics.add.existing(e);
                            e.body.setCollideWorldBounds(true);
                            this.enemies.push(e);
                        }

                        // shooting logic
                        this.input.on('pointerdown', () => {
                            let bullet = this.add.circle(player.x, player.y, 4, 0xffff00);
                            this.physics.add.existing(bullet);
                            bullet.body.setVelocity(300, 0);
                            this.time.delayedCall(1000, () => bullet.destroy());
                        });

                        this.update = function() {
                            // basic AI
                            this.enemies.forEach(e => {
                                this.physics.moveToObject(e, player, 50);
                            });
                        };
                    }
                }
            };
            window.babyCommandoGame = new Phaser.Game(config);
            // hide cover
            const cover = slide.querySelector('#cover-baby-commando');
            if (cover) cover.style.display = 'none';
        }

        // ========== INIT ==========
        window.addEventListener('DOMContentLoaded', () => {
            loadUser();
            renderDashboard();
            // ambient
            let canvas = document.createElement('canvas');
            canvas.id = 'ambient';
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particles = [];
            for (let i = 0; i < 30; i++) particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                c: i % 2 === 0 ? '#00f2fe' : '#ff0050'
            });
            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.globalAlpha = 0.4;
                    ctx.fillStyle = p.c;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            animate();
        });

        // ========== EXPOSE ==========
        window.openTheme = openTheme;
        window.closeTheme = closeTheme;
        window.setTheme = setTheme;
        window.showFeed = showFeed;
        window.showDashboard = showDashboard;
        window.launchCabinet = launchCabinet;
        window.exitCabinet = exitCabinet;
        window.startGameInSlide = startGameInSlide;
        window.restartGame = restartGame;
        window.showGameOver = showGameOver;
        window.toggleVote = toggleVote;
        window.toggleParty = function() { document.body.classList.toggle('party-active'); showToast('Party mode!'); };
    </script>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(reg => console.log('SW registered:', reg.scope))
    .catch(err => console.warn('SW failed:', err));
}
</script>
